---
sensitive_vars:
  github_private_key:
    context: global
    vars:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
  s3cfg:
    context: environment
    vars:
      - name: aws_access_key_id
        prompt: AWS Access Key ID (needed to pull stuff from S3)
      - name: aws_secret_access_key
        prompt: AWS Secret Access Key (needed to pull stuff from S3)

server_vars:
  nagios_https_port: 443
  nagios_http_port: 80

regions:
  - region: ap-southeast-1
    environments:
      development:
        server_vars:
          nagios_user: user_development
          nagios_password: password_development
        servers:
          - hostname: nagios-server-apse1.action.io
            size: m1.small
            ami: ami-deadbeef
            server_vars:
              nagios_email: nagios-apse-1@nagios.com
            block_devices:
              - name: /dev/sdf
                snapshot_id: snap-deadbeef
                size: 20
                delete_on_termination: 'false'
              - name: /dev/sdg
                snapshot_id: snap-deadbeef
                size: 40
                delete_on_termination: 'false'

          - hostname: nagios-server-apse2.action.io
            size: m1.large
            ami: ami-deadbeef
            server_vars:
              nagios_email: nagios-apse-2@nagios.com
            block_devices:
              - name: /dev/sdf
                snapshot_id: snap-1d909139
                size: 20
                delete_on_termination: 'false'

  - region: us-west-1
    environments:
      production:
        server_vars:
          nagios_user: user_production
          nagios_password: password_production
        servers:
          - hostname: nagios-server-usw1.action.io
            size: m1.small
            ami: ami-deadbeef
            server_vars:
              nagios_email: nagios-usw-1@nagios.com
