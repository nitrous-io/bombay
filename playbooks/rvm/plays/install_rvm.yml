---
- hosts: ruby_template
  user: action
  sudo: False
  gather_facts: False
  vars:
   ruby_ver: 1.9.3-p194
   rvm_path: /home/action/.rvm
  tasks:
    
   - name: install rvm
     action: shell curl -L https://get.rvm.io | bash -s stable &> /dev/null creates=${rvm_path}

   - name: install ruby-${ruby_ver} and set as default
     action: shell source ${rvm_path}/scripts/rvm && ${rvm_path}/bin/rvm install ${ruby_ver} --binary  && ${rvm_path}/bin/rvm --default user ${ruby_ver}
