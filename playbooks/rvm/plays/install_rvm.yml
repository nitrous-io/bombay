---
- hosts: ruby_template
  user: action
  sudo: False
  gather_facts: False
  vars:
   ruby_ver: 1.9.3-p194
  tasks:
  
   - name: install rvm
     action: shell curl -L https://get.rvm.io | bash -s stable &> /dev/null creates=/home/action/.rvm
   
   - name: run rvm script 
     action: shell /bin/bash /home/action/.rvm/scripts/rvm
  
   - name: install ruby
     action: shell /bin/bash /home/action/.rvm/bin/rvm install ${ruby_ver} creates=/home/action/.rvm/environments/ruby-${ruby_ver}
