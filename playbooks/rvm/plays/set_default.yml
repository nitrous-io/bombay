---
- hosts: ruby_template
  user: action
  sudo: False
  gather_facts: False
  vars:
   ruby_ver: 1.9.3-p194
  tasks:
  
   - name: use ruby-${ruby_ver}
     action: shell /home/action/.rvm/bin/rvm use $ruby_ver
  
   - name: set as default
     action: shell /home/action/.rvm/bin/rvm default $ruby_ver
