---
- hosts: ruby_template
  user: action
  sudo: False
  gather_facts: False

  vars:
   ruby_ver: 1.9.3-p194

  tasks:

   - name: copy set-rvm-default.sh
     action: copy src=../files/set-rvm-default.sh dest=/home/action/set-rvm-default.sh owner=action group=action mode=0755
 
   - name: run set-rvm-default.sh
     action: shell /bin/bash /home/action/set-rvm-default.sh

   - name: remove set-rvm-default.sh
     action: file dest=/home/action/set-rvm-default.sh state=absent
