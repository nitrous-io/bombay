---
- name: install libxml2-dev
  action: apt pkg=libxml2-dev state=present
- name: install libxslt1-dev
  action: apt pkg=libxslt1-dev state=present
- name: install libmagickwand-dev
  action: apt pkg=libmagickwand-dev state=present
- name: install libyaml-dev
  action: apt pkg=libyaml-dev state=present
- name: install libcurl3
  action: apt pkg=libcurl3 state=present
- name: install libcurl4-openssl-dev
  action: apt pkg=libcurl4-openssl-dev state=present
- name: install imagemagick
  action: apt pkg=imagemagick state=present
