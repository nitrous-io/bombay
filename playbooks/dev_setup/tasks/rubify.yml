- name: install ruby related packages
  action: apt pkg=$item state=present
  with_items:
    - build-essential
    - libsqlite3-dev
    - libpq-dev
    - man-db
    - ssh
    - git-core
    - nano
    - emacs23-nox
    - tmux
    - screen
    - zsh
    - libxml2-dev
    - libxslt1-dev
    - libmagickwand-dev
    - libcurl4-openssl-dev
    - libcurl3
    - imagemagick
    - zlib1g
    - openssl
    - libssl-dev
    - libreadline-dev
