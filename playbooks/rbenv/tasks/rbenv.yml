- name: clone rbenv
  action: git url=git://github.com/sstephenson/rbenv.git dest=/home/action/.rbenv

- name: ensure plugins dir is present
  action: file dest=/home/action/.rbenv/plugins state=directory mode=0755 owner=action group=action
  
- name: clone ruby-build
  action: git url=git://github.com/sstephenson/ruby-build.git dest=/home/action/.rbenv/plugins/ruby-build
