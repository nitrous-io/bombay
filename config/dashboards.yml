---
metric_collections:
  load_avg: &load_avg
    - loadavg.01
    - loadavg.05
    - loadavg.15
    - loadavg.processes_running

  memory: &memory
    - memory.MemFree
    - memory.MemTotal
    - memory.SwapFree
    - memory.SwapTotal

  redis_cpu: &redis_cpu
    - redis.65000.cpu.parent.sys
    - redis.65000.cpu.parent.user
    - redis.65000.process.uptime

  redis_memory: &redis_memory
    - redis.65000.memory.external_view
    - redis.65000.memory.internal_view
    - redis.65000.memory.fragmentation_ratio

  redis_stats: &redis_stats
    - redis.65000.process.commands_processed
    - redis.65000.process.connections_received
    - redis.65000.clients.connected
    - redis.65000.clients.blocked

