# format is:  port-range<tab>protocol<tab>source
# if you want to allow all sources, then specify the source to be 0.0.0.0/0
rainbow:
  #SSL
  - 443 tcp 0.0.0.0/0
  # SSH
  - 65100 tcp 0.0.0.0/0

box_host:
  # http ports for servers
  - 3000-9000 tcp 0.0.0.0/0
  # ssh ports for boxes
  - 10000-20000 tcp 0.0.0.0/0
  # ssh
  - 65100 tcp 0.0.0.0/0

coach:
  # ssl
  - 443 tcp 0.0.0.0/0
  # redis
  - 65000 tcp box_host
  # ssh
  - 65100 tcp 0.0.0.0/0
  # e.g. by ip
  # 65200 tcp 192.168.254.1

dev:
  - 65100 tcp 0.0.0.0/0
  # ssh ports for boxes
  - 10000-20000 tcp 0.0.0.0/0
  - 25565 tcp 0.0.0.0/0
  - 60000-61000 udp 0.0.0.0/0

bombay:
  - 65100 tcp 0.0.0.0/0


statsd:
  - 65100 tcp 0.0.0.0/0
  - 9125 udp box_host
  - 9125 udp coach
  - 9125 udp rainbow
  - 9125 udp dev
  # The following rule is for heroku, so heroku app can send request to statsd
  # server. Refers to the article below for more information
  # https://devcenter.heroku.com/articles/dynos#connecting-to-external-services
  - 9125 udp 098166147350:default
