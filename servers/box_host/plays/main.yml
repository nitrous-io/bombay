---
- hosts: box_host
  sudo: True
  gather_facts: False
  vars_files:
    - ../../../config/deploy_keys.yml
  vars:
    app_1: boxer
    app_2: proxee
    app_directory_1: /var/apps/${app_1}
    app_directory_2: /var/apps/${app_2}
    deploy_user: action
    node_version: v0.8.11
    redis_port: 65000
    s3_bucket: bombay-apse.action.io
    gateway: 192.168.254.1
  tasks:
    # Set the hostname
    - include: ../../../global/tasks/set_hostname.yml
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../../global/tasks/install_ansible_deps.yml
    # Setup Bridge Network
    - include: ../../../global/tasks/host/setup_bridge_network.yml gateway=$gateway
    # apt-get update
    - include: ../../../global/tasks/update_apt.yml
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml
    # Install sudoers
    - include: ../../../global/tasks/install_sudoers.yml file=../files/box_host_sudoers
    # Install pam.d/common-session which sets limits for non-interactive sessions
    - name: install common-session in /etc/init.d/
      action: copy src=../files/pam_common-session dest=/etc/pam.d/common-session owner=root group=root mode=0644
    # Create Deploy User
    - include: ../../../global/tasks/create_deploy_user.yml deploy_user=$deploy_user
    # Create Capistrano Layout for $app_directory_1
    - include: ../../../global/tasks/create_capistrano_app_layout.yml app_directory=$app_directory_1 deploy_user=$deploy_user
    # Setup .env for boxer
    - name: setup env for boxer
      action: copy src=../files/boxer_env.$env dest=$app_directory_1/shared/config/.env owner=$deploy_user group=$deploy_user mode=0660
    # Setup runtimes.coffee for boxer
    - name: setup runtimes.coffee for boxer
      action: copy src=../files/runtimes.coffee.$env dest=$app_directory_1/shared/config/runtimes.coffee owner=$deploy_user group=$deploy_user mode=0660
    # Create Capistrano Layout for $app_directory_2
    - include: ../../../global/tasks/create_capistrano_app_layout.yml app_directory=$app_directory_2 deploy_user=$deploy_user
    # Setup .env for proxee
    - name: setup env for proxee
      action: copy src=../files/proxee_env.$env dest=$app_directory_2/shared/config/.env owner=$deploy_user group=$deploy_user mode=0660
    # Generate and Upload Public Key to GitHub
    - include: ../../../global/tasks/register_github_keys.yml deploy_user=$deploy_user
    # Set limits for the user
    - include: ../../../global/tasks/set_limits.yml user=$deploy_user attribute=nofile value=65536
    # Install Redis Server
    - include: ../../../global/tasks/install_redis.yml port=$redis_port
    # Configure S3 Cmd
    - include: ../../../global/tasks/configure_s3cmd.yml
    # Install container
    - include: ../tasks/install_action_container.yml name=ruby_container_template version=1349954062 s3_bucket=$s3_bucket
    # Install NVM
    - include: ../../../global/tasks/container/install_node_via_nvm.yml version=$node_version user=$deploy_user
    # Install Upstart for boxer
    - include: ../../../global/tasks/install_upstart_for_app.yml app=$app_1 deploy_user=$deploy_user node_version=$node_version
    # Install Upstart for proxee
    - include: ../../../global/tasks/install_upstart_for_app.yml app=$app_2 deploy_user=$deploy_user node_version=$node_version
    # Initialize Redis
    - include: ../tasks/setup_redis_init_script.yml
  handlers:
    - name: restart redis
      action: shell /etc/init.d/redis-server restart
      notify: initialize redis
    - name: initialize redis
      action: shell /tmp/initialize_redis.sh $redis_port

