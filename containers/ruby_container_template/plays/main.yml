---
- hosts: localhost
  connection: local
  sudo: False
  gather_facts: False
  tasks:
    - include: ../tasks/host/setup_bombay_ssh_keys.yml

- hosts: localhost
  connection: local
  sudo: True
  gather_facts: False
  vars:
    container_template: ruby_container_template
    ip: 192.168.254.254
    gateway: 192.168.254.1
  tasks:
    # Install Dependencies (via apt-get)
    - include: ../tasks/host/install_deps.yml
    # Setup Bridge Network
    - include: ../tasks/host/setup_bridge_network.yml gateway=$gateway
    # Create LXC container with the name
    - include: ../tasks/host/create_lxc_container.yml container_template=$container_template
    # Setup keys so that we can run ansible commands in the container
    - include: ../tasks/host/setup_networking_for_container.yml ip=$ip container_template=$container_template gateway=$gateway
    # Start the container if it isn't started
    - include: ../tasks/host/start_container.yml container_template=$container_template

- hosts: ruby_container_template
  connection: ssh
  user: action
  sudo: True
  gather_facts: False

  tasks:
    - include: ../../../global/container_packages.yml
    - include: ../../../global/nvm.yml version=v0.8.11 user=action

