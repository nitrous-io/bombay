---
- hosts: localhost
  connection: local
  sudo: False
  gather_facts: False
  tasks:
    - include: ../../../global/tasks/host/setup_bombay_ssh_keys.yml

- hosts: localhost
  connection: local
  sudo: True
  gather_facts: False
  vars:
    container_template: ruby_container_template
    ip: 192.168.254.254
    gateway: 192.168.254.1
  tasks:
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../../global/tasks/install_ansible_deps.yml
    # apt-get update
    - include: ../../../global/tasks/update_apt.yml
    # Install Dependencies (via apt-get)
    - include: ../../../global/tasks/host/install_deps.yml
    # Setup Bridge Network
    - include: ../../../global/tasks/host/setup_bridge_network.yml gateway=$gateway
    # Create LXC container with the name
    - include: ../../../global/tasks/host/create_lxc_container.yml container_template=$container_template
    # Setup keys so that we can run ansible commands in the container
    - include: ../../../global/tasks/host/setup_networking_for_container.yml ip=$ip container_template=$container_template gateway=$gateway
    # Add action to the password-less sudoers file
    - include: ../../../global/tasks/add_user_to_sudoers.yml container_template=$container_template user=action
    # Start the container if it isn't started
    - include: ../../../global/tasks/host/start_container.yml container_template=$container_template

# Install stuff which needs to be done as root
- hosts: ruby_container_template
  connection: ssh
  user: action
  sudo: True
  gather_facts: False

  tasks:
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../../global/tasks/install_ansible_deps.yml
    # apt-get update
    - include: ../../../global/tasks/update_apt.yml
    # Configure SSH
    - include: ../../../global/tasks/container/configure_sshd_config.yml
    # Remove ubuntu user from the container
    - include: ../../../global/tasks/container/remove_ubuntu_user.yml
    # Add MOTD
    - include: ../../../global/tasks/container/configure_motd.yml
    # Install all the necessary packages for this container
    - include: ../../../global/tasks/container/install_packages.yml
    # Install locales
    - include: ../../../global/tasks/container/install_locales.yml user=action

# Install stuff which needs to be done not as root
- hosts: ruby_container_template
  connection: ssh
  user: action
  sudo: False
  gather_facts: False

  tasks:
    - include: ../../../global/tasks/container/install_ruby_via_rvm.yml version=1.9.3-p194 user=action
    - include: ../../../global/tasks/container/install_node_via_nvm.yml version=v0.8.11 user=action

# Cleanup to be done after the creation of the container
- hosts: localhost
  connection: local
  sudo: True
  gather_facts: False
  vars:
    container_template: ruby_container_template
  tasks:
    # remove action from the sudoers file
    - include: ../../../global/tasks/remove_user_from_sudoers.yml container_template=$container_template

