---
- name: Setup Networking for the container
  action: template src=../templates/container_network_config dest=/var/lib/lxc/$container_template/rootfs/etc/network/interfaces

- name: Create an action user in the $container_template box
  action: shell chroot /var/lib/lxc/$container_template/rootfs useradd action -m -s /bin/bash creates=/var/lib/lxc/$container_template/rootfs/home/action

- name: Create an .ssh/authorized_keys file for the action user
  action: shell chroot /var/lib/lxc/$container_template/rootfs su action -c "mkdir /home/action/.ssh" creates=/var/lib/lxc/$container_template/rootfs/home/action/.ssh

- name: Copy the public key to the action user's authorized_keys file
  action: shell cat $HOME/.ansible/bombay.pub >> /var/lib/lxc/$container_template/rootfs/home/action/.ssh/authorized_keys creates=/var/lib/lxc/$container_template/rootfs/home/action/.ssh/authorized_keys

- name: Set the right permissions for the user's authorized_keys file
  action: shell chroot /var/lib/lxc/$container_template/rootfs chown action:action /home/action/.ssh/authorized_keys

- name: Copy the sudoers file to $container_template so that the action user will have password-less sudo privileges
  action: template src=../templates/container_sudoers dest=/var/lib/lxc/$container_template/rootfs/etc/sudoers owner=root group=root mode=0440


