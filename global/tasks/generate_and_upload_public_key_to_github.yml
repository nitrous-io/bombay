---
- name: check for existence of public key
  action: shell cat /home/$deploy_user/.ssh/id_rsa.pub
  ignore_errors: True
  register: action_key_exists

- name: generate public key
  action: shell su $deploy_user bash -c "/usr/bin/ssh-keygen -N '' -b 1024 -f /home/$deploy_user/.ssh/id_rsa -t rsa -q"
  only_if: "len('${action_key_exists.stdout}') == 0"

- name: get the public key
  action: shell cat /home/$deploy_user/.ssh/id_rsa.pub
  register: action_public_key

- name: Upload To GitHub
  action: shell curl -u "${gh_username}:${gh_password}" https://api.github.com/user/keys -X POST -d '{"title":"rainbow key","key":"${action_public_key.stdout}"}' && touch $HOME/.githubbed creates=$HOME/.githubbed
