---
- name: create main app directory
  action: file path=$app_directory owner=$deploy_user group=$deploy_user state=directory mode=0770

- name: create capistrano subdirectories
  action: file path=$app_directory/$item owner=$deploy_user group=$deploy_user state=directory mode=0770
  with_items:
   - releases
   - shared
   - shared/system
   - shared/log
   - shared/pids
   - shared/node_modules
   - shared/config
