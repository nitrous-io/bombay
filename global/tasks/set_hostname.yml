---
- name: check if the hostname is the same as $inventory_hostname
  action: shell cat /etc/hostname
  register: hostname

- name: set hostname
  action: shell echo '${inventory_hostname}' > /etc/hostname
  only_if: "'${hostname.stdout}' != '${inventory_hostname}'"

- name: restart hostname service
  action: shell service hostname restart
  only_if: "'${hostname.stdout}' != '${inventory_hostname}'"

