---
- hosts: dev
  sudo: True
  gather_facts: False

  vars_files:
    - ../../vars_files/stunnel_key.yml
    - ../../vars_files/stunnel_pem.yml

  tasks:
    - include: ../../shared/plays/stunnel/tasks/task.yml
    - name: specific setup for stunnel ports in dev
      copy: src=../files/stunnel.conf dest=/etc/stunnel/stunnel.conf owner=stunnel4 group=stunnel4 mode=0660
      notify: restart stunnel

  handlers:
    - include: ../../shared/plays/stunnel/handlers/handler.yml
