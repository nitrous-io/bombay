---
- hosts: dev
  sudo: True
  gather_facts: False
  vars:
    redis_port: 6379

  tasks:
    - include: ../../shared/tasks/update_apt.yml
    - include: ../../shared/tasks/install_redis_with_resources.yml redis_port=$redis_port

  handlers:
    - name: restart redis
      action: shell /etc/init.d/redis-server restart
      notify: initialize redis
    - name: initialize redis
      action: shell /tmp/initialize_redis.sh $redis_port
