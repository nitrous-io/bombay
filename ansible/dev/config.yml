---
sensitive_vars:
  github_private_key:
    context: global
    vars:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
  s3cfg:
    context: global
    vars:
      - name: aws_access_key_id
        prompt: AWS Access Key ID (needed to pull from stuff from S3)
      - name: aws_secret_access_key
        prompt: AWS Secret Access Key (needed to pull stuff from S3)

server_vars:
  pg_user: action
  pg_password: password

regions:
  - region: ap-southeast-1
    environments:
      development:
        servers:
          - hostname: choonkeats-box.actionbox.io
            size: m1.small
            ami: ami-e6d999b4
            server_vars:
              username: choonkeat
              github_username: choonkeat
              github_email: choonkeat@gmail.com
            block_devices:
              - DeviceName: /dev/sdf
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 20
                Ebs.DeleteOnTermination: 'false'

