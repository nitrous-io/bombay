---
sensitive_vars:
  github_private_key:
    context: global
    vars:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
  s3cfg:
    context: global
    vars:
      - name: aws_access_key_id
        prompt: AWS Access Key ID (needed to pull from stuff from S3)
      - name: aws_secret_access_key
        prompt: AWS Secret Access Key (needed to pull stuff from S3)

server_vars:
  pg_user: action
  pg_password: password
  local_redis_host: 127.0.0.1
  local_redis_port: 65000
  stunnel_port: 5001

regions:
  - region: us-west-1
    environments:
      development:
        servers:
          - hostname: petes-usw-box.actionbox.io
            size: m1.small
            ami: ami-977b5dd2
            server_vars:
              username: action
              github_username: petejkim
              github_email: raingrove@gmail.com
            block_devices:
              - name: /dev/sdf
                snapshot_id: snap-566c3c7a
                size: 20
                delete_on_termination: 'false'

