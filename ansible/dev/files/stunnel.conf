chroot = /var/run/stunnel/
pid = /stunnel.pid
setuid = stunnel4
setgid = stunnel4
cert = /etc/stunnel/certs/stunnel.pem
key = /etc/stunnel/keys/stunnel.key
options = NO_SSLv2
foreground = no

[https]
  accept  = 5001
  connect = 3001
  TIMEOUTclose = 0

