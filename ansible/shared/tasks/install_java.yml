---
- name: add java7 ppa
  action: apt_repository repo=ppa:webupd8team/java

- name: accept license part 1
  shell: bash -c "echo debconf shared/accepted-oracle-license-v1-1 select true | sudo debconf-set-selections"

- name: accept license part 2
  shell: bash -c "echo debconf shared/accepted-oracle-license-v1-1 seen true | sudo debconf-set-selections"

- name: install java7
  action: apt pkg=oracle-java7-installer state=present update-cache=yes

