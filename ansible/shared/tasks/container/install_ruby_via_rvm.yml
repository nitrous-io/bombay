---
- name: install rvm
  action: shell su $user -c "curl -L https://get.rvm.io | bash -s stable" creates=/home/${user}/.rvm chdir=/home/${user}
  ignore_errors: True

- name: install ruby-${version} and set as the default
  action: shell su $user -c "test -d /home/${user}/.rvm && /home/${user}/.rvm/bin/rvm install ${version} --binary && /home/${user}/.rvm/bin/rvm alias create default ruby-${version}" creates=/home/${user}/.rvm/rubies/ruby-${version}/bin/ruby

