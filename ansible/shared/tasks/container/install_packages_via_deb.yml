---
- name: Check if package is already installed
  action: shell bash -c "dpkg -s the-silver-searcher"
  register: deb_package_installed

- name: Download the package
  action: get_url url=https://github.com/downloads/ggreer/the_silver_searcher/the-silver-searcher_0.7.3-3_amd64.deb dest=/tmp/the-silver-searcher_0.7.3-3_amd64.deb
  only_if: "len('${deb_package_installed.stdout}') == 0"

- name: Install the package
  action: shell dpkg -i /tmp/the-silver-searcher_0.7.3-3_amd64.deb
  only_if: "len('${deb_package_installed.stdout}') == 0"

