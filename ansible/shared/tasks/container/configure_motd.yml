---
- name: Update MOTD Header
  action: copy dest=/etc/update-motd.d/00-header src=../../shared/files/container/motd_header mode=0755

- name: Make sure the custom MOTD help section is missing
  action: file dest=/etc/update-motd.d/10-help-text state=absent

- name: Make sure the footer file is missing
  action: file dest=/etc/update-motd.d/99-footer state=absent
