# This download appengine to user workspace
---
- name: download and install appengine to userspace
  shell: cd $HOME
         && rm -Rf $HOME/.google_appengine
         && rm -f $HOME/$appengine_container
         && wget http://googleappengine.googlecode.com/files/$appengine_container
         && unzip $HOME/$appengine_container
         && rm $HOME/$appengine_container
         && mv google_appengine .google_appengine
