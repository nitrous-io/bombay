---
  - name: mkdir essential directories
    shell: mkdir -p ${item}
    with_items:
      - /etc/action
      - /lib/action

  - name: copy over pam_action.so from shared/files/container
    copy: src=../../shared/files/container/pam_action.so dest=/lib/action/pam_action.so owner=root group=root mode=644

  - name: copy over /etc/pam conf
    copy: src=../../shared/files/container/pam.d_login dest=/etc/pam.d/login owner=root group=root mode=0644
