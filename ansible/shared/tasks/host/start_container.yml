---
- name: Check for container_template running status
  action: shell lxc-info -n $container_template | head -1
  register: container_status

- name: Start the Container
  action: shell lxc-start -n $container_template -d
  only_if: "'${container_status.stdout}'.find('RUNNING') == -1"

- name: Wait for SSH to come up
  action: shell /bin/bash -c "while ! nc -z ${ip} 22 ; do echo ''; done"
