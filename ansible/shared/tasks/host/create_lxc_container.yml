---
- name: Setup the conf file for the default LXC config
  # Paths are relative to the containers/${container_template}/plays directory
  action: template src=../../shared/templates/host/lxc_default.conf dest=/tmp/lxc_default.conf

- name: Create LXC Container
  action: shell lxc-create -n $container_template -t ubuntu -f /tmp/lxc_default.conf creates=/var/lib/lxc/$container_template
