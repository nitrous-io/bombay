---
- name: Check if br-lxc-$item is up
  action: shell /sbin/ifconfig br-lxc-$item | head -1
  register: ifconfig_bridge

- name: Bring up the br-lxc-$item network interface
  action: command /sbin/ifup br-lxc-$item
  only_if: "len('${ifconfig_bridge.stdout}') == 0"

- name: Get the iptables rule for the bridge network 192.168.${item}.0
  action: shell (/sbin/iptables -t nat --list | /bin/grep 192-168-${item}-0) || /sbin/iptables -t nat -A POSTROUTING -o eth0 -s 192.168.${item}.0/24 -j MASQUERADE
  ignore_errors: True
