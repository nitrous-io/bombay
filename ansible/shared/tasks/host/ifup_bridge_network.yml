---
- name: Check if br-lxc-$subnet is up
  action: shell /sbin/ifconfig br-lxc-$subnet | head -1
  register: ifconfig_bridge

- name: Bring up the br-lxc-$subnet network interface
  action: command /sbin/ifup br-lxc-$subnet
  only_if: "len('${ifconfig_bridge.stdout}') == 0"

- name: Get the iptables rule for the bridge network 192.168.${subnet}.0
  action: shell (/sbin/iptables -t nat --list | /bin/grep 192-168-${subnet}-0) || /sbin/iptables -t nat -A POSTROUTING -o eth0 -s 192.168.${subnet}.0/24 -j MASQUERADE
  ignore_errors: True
