---
- name: mkdir .ssh
  action: file dest=/home/$deploy_user/.ssh owner=$deploy_user group=$deploy_user mode=0700 state=directory

- name: copy gh_action_deployer private key
  action: template src=../../shared/templates/github_private_key.j2 dest=/home/$deploy_user/.ssh/gh_action_deployer owner=$deploy_user group=$deploy_user mode=0600

- name: set ~/.ssh/config to github
  action: copy src=../../shared/files/ssh_config dest=/home/$deploy_user/.ssh/config owner=$deploy_user group=$deploy_user mode=0600
