---
- hosts: all
  sudo: True
  gather_facts: False
  vars:
    papertrail_port: 19211

  tasks:
    # Install dependencies
    - name: install dependencies
      apt: pkg=$item
      with_items:
        - build-essential
        - libssl-dev
        - ruby1.9.3
        - ruby1.9.1-dev
        - rsyslog-gnutls

    - name: increase limits for inotify
      shell: bash -c "echo 256 > /proc/sys/fs/inotify/max_user_instances"

    - name: install remote_syslog gem
      action: shell gem install remote_syslog

    - name: install papertrail crt
      copy: src=files/syslog.papertrail.crt dest=/etc/syslog.papertrail.crt owner=root group=root mode=0644

    - name: install remote_syslog init.d script
      copy: src=files/remote_syslog.init.d dest=/etc/init.d/remote_syslog owner=root group=root mode=0755

    - name: make remote_syslog gem restart on boot
      shell: update-rc.d remote_syslog
      ignore_errors: True

    - name: install remote_syslog gem config
      template: src=templates/log_files.yml.j2 dest=/etc/log_files.yml owner=root group=root mode=0644
      notify: restart remote_syslog

    - name: install papertrail config
      template: src=templates/rsyslog.conf.j2 dest=/etc/rsyslog.conf owner=root group=root mode=0644
      notify: restart rsyslog

  handlers:
    - include: handlers/handler.yml
