# Node.js processes
- name: check if this has statsd installed
  action: shell /bin/bash -c 'ls /var/apps/ | grep statsd'
  register: has_statsd_installed
  ignore_errors: True

- name: install statsd node.js monitoring config
  action: template src=../../../shared/plays/monit/templates/statsd-monit.j2 dest=/etc/monit/conf.d/statsd-monit owner=root group=root mode=0644
  notify: restart monit
  only_if: "len('${has_statsd_installed.stdout}') != 0"

