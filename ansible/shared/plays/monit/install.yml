---
- hosts: all
  sudo: True

  tasks:
    - name: get hostname
      action: command /bin/bash -c 'hostname'
      register: hostname

    # monit needs a mailserver
    - include: ../../../shared/tasks/install_postfix.yml

    - name: install monit
      action: apt pkg=monit state=present

    - name: install main monit config
      action: template src=../../../shared/plays/monit/templates/monitrc.j2 dest=/etc/monit/monitrc owner=root group=root mode=0644
      notify: restart monit

    - name: install root disk monitoring config
      action: copy src=../../../shared/plays/monit/files/root-disk-space-monit dest=/etc/monit/conf.d/disk-space-monit owner=root group=root mode=0644
      notify: restart monit

    # nginx
    - name: check if nginx is installed
      action: shell /bin/bash -c 'dpkg -l | grep nginx'
      register: has_nginx
      ignore_errors: True

    - name: install nginx monitoring config
      action: template src=../../../shared/plays/monit/templates/nginx-monit.j2 dest=/etc/monit/conf.d/nginx-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_nginx.stdout}') != 0"

    # haproxy
    - name: check if haproxy is installed
      action: shell /bin/bash -c 'dpkg -l | grep haproxy'
      register: has_haproxy
      ignore_errors: True

    - name: install haproxy monitoring config
      action: template src=../../../shared/plays/monit/templates/haproxy-monit.j2 dest=/etc/monit/conf.d/haproxy-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_haproxy.stdout}') != 0"

    # custom disks - /var/lib/lxc
    - name: check if /var/lib/lxc is present
      action: shell /bin/bash -c 'mount | grep /var/lib/lxc'
      register: has_lxc_dir
      ignore_errors: True

    - name: install /var/lib/lxc disk monitoring config
      action: template src=../../../shared/plays/monit/files/var-lib-lxc-disk-monit dest=/etc/monit/conf.d/lxc-dir-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_lxc_dir.stdout}') != 0"

    # custom disks - /var/action
    - name: check if /var/action is present
      action: shell /bin/bash -c 'mount | grep /var/action'
      register: has_action_dir
      ignore_errors: True

    - name: install /var/action disk monitoring config
      action: template src=../../../shared/plays/monit/files/var-action-disk-monit dest=/etc/monit/conf.d/action-dir-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_action_dir.stdout}') != 0"

    # node.js apps
    - include: ../../../shared/plays/monit/tasks/node-monit.yml node_app=rainbow
    - include: ../../../shared/plays/monit/tasks/node-monit.yml node_app=coach
    - include: ../../../shared/plays/monit/tasks/node-monit.yml node_app=proxee
    - include: ../../../shared/plays/monit/tasks/node-monit.yml node_app=boxer
    - include: ../../../shared/plays/monit/tasks/statsd-monit.yml

    # stunnel check
    - name: check if stunnel is installed
      action: shell /bin/bash -c 'dpkg -l | grep stunnel4'
      register: has_stunnel
      ignore_errors: True

    - name: install stunnel monitoring config
      action: copy src=../../../shared/plays/monit/files/stunnel-monit dest=/etc/monit/conf.d/stunnel-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_stunnel.stdout}') != 0"

    # sshd check
    - name: check if openssh-server is installed
      action: shell /bin/bash -c 'dpkg -l | grep openssh-server'
      register: has_sshd
      ignore_errors: True

    - name: install sshd monitoring config
      action: copy src=../../../shared/plays/monit/files/sshd-monit dest=/etc/monit/conf.d/sshd-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_sshd.stdout}') != 0"

    # redis check
    - name: check if redis-server is installed
      action: shell /bin/bash -c 'dpkg -l | grep redis-server'
      register: has_redis
      ignore_errors: True

    - name: install redis monitoring config
      action: template src=../../../shared/plays/monit/templates/redis-monit.j2 dest=/etc/monit/conf.d/redis-monit owner=root group=root mode=0644
      notify: restart monit
      only_if: "len('${has_redis.stdout}') != 0"

  handlers:
    - include: ../../../shared/plays/monit/handlers/handler.yml
