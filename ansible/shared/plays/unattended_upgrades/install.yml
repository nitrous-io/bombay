---
- hosts: all
  sudo: True
  gather_facts: False

  vars:
    notification_email: eng@action.io

  tasks:
    - name: Install unattended upgrades
      apt: pkg=unattended-upgrades state=present
    # For sending emails of security updates
    - name: Install mailx
      apt: pkg=mailx state=present

    - name: copy apt-conf for 20auto-upgrades
      template: src=../../../shared/plays/unattended_upgrades/templates/20auto-upgrades.j2 dest=/etc/apt/apt.conf.d/20auto-upgrades

    - name: copy apt-conf for 50unattended_upgrades
      template: src=../../../shared/plays/unattended_upgrades/templates/50unattended-upgrades.j2 dest=/etc/apt/apt.conf.d/50unattended-upgrades
