---
- hosts: localhost
  connection: local
  sudo: True
  gather_facts: False

  vars:
    builder_container: builder_container
    container_template: base_container_template

  tasks:
    - name: check if base_container_template is stopped
      shell: lxc-info -n $container_template | head -1
      register: base_container_status

    - name: stop base_container_template if it is running
      shell: lxc-stop -n $container_template
      only_if: "'${container_status.stdout}'.find('STOPPED') == -1"

    - name: copy create_builder_container script
      copy: src=./files/create_builder_container.sh dest=/tmp/create_builder_container.sh owner=root group=root mode=740

    - name: create builder container
      shell: /tmp/create_builder_container.sh $builder_container
