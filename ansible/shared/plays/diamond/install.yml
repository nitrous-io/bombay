---
- hosts: all
  sudo: True

  vars:
    diamond_version: a9f88bcb882596397d31595888852b67f2856daf

  vars_files:
    - ../../../vars_files/diamond.${env}.yml

  tasks:
    # redis check
    - name: check if redis-server is installed
      action: shell /bin/bash -c 'dpkg -l | grep redis-server'
      register: has_redis
      ignore_errors: True

    # nginx
    - name: check if nginx is installed
      action: shell /bin/bash -c 'dpkg -l | grep nginx'
      register: has_nginx
      ignore_errors: True

    # haproxy
    - name: check if haproxy is installed
      action: shell /bin/bash -c 'dpkg -l | grep haproxy'
      register: has_haproxy
      ignore_errors: True

    - name: install dependencies to build diamond
      apt: pkg=$item
      with_items:
        - python-dev
        - python-setuptools
        - build-essential
        - pbuilder
        - python-mock
        - python-configobj
        - python-support
        - cdbs

    - name: install pip
      easy_install: name=pip

    - name: install dependencies via pip
      pip: name=$item
      with_items:
        - SimpleJson
        - requests
        - redis
        - urllib3
        - psutil

    - name: install diamond
      git: repo=git://github.com/action-io/Diamond.git dest=/tmp/Diamond version=$diamond_version

    - name: build diamond
      action: shell bash -c "cd /tmp/Diamond && make builddeb"

    - name: install diamond
      action: shell bash -c "cd /tmp/Diamond && dpkg -i build/diamond*_all.deb"

    - name: copy diamond config
      action: template src=../../../shared/plays/diamond/templates/diamond.conf.j2 dest=/etc/diamond/diamond.conf mode=0644 owner=root group=root
      notify: restart diamond

    - name: copy /etc/init/diamond.conf
      action: template src=../../../shared/plays/diamond/templates/init_diamond.conf.j2 dest=/etc/init/diamond.conf mode=0644 owner=root group=root
      notify: restart diamond

    # Install Default Collectors
    - name: install cpu acct collector
      copy: src=../../../shared/plays/diamond/files/CpuAcctCgroupCollector.conf dest=/etc/diamond/collectors/CpuAcctCgroupCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install cpu collector
      copy: src=../../../shared/plays/diamond/files/CPUCollector.conf dest=/etc/diamond/collectors/CPUCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install disk space collector
      copy: src=../../../shared/plays/diamond/files/DiskSpaceCollector.conf dest=/etc/diamond/collectors/DiskSpaceCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install load average collector
      copy: src=../../../shared/plays/diamond/files/LoadAverageCollector.conf dest=/etc/diamond/collectors/LoadAverageCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install memory collector
      copy: src=../../../shared/plays/diamond/files/MemoryCollector.conf dest=/etc/diamond/collectors/MemoryCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install network collector
      copy: src=../../../shared/plays/diamond/files/NetworkCollector.conf dest=/etc/diamond/collectors/NetworkCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install process stats collector
      copy: src=../../../shared/plays/diamond/files/ProcessStatCollector.conf dest=/etc/diamond/collectors/ProcessStatCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
    - name: install redis collector
      template: src=../../../shared/plays/diamond/templates/RedisCollector.conf.j2 dest=/etc/diamond/collectors/RedisCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
      only_if: "len('${has_redis.stdout}') != 0"
    - name: install nginx collector
      copy: src=../../../shared/plays/diamond/files/NginxCollector.conf dest=/etc/diamond/collectors/NginxCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
      only_if: "len('${has_nginx.stdout}') != 0"
    - name: install haproxy collector
      copy: src=../../../shared/plays/diamond/files/HAProxyCollector.conf dest=/etc/diamond/collectors/HAProxyCollector.conf mode=0644 owner=root group=root
      notify: restart diamond
      only_if: "len('${has_haproxy.stdout}') != 0"

  handlers:
    - include: ../../../shared/plays/diamond/handlers/handler.yml
