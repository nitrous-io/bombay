---
- hosts: all
  sudo: True
  gather_facts: False

  vars:
    redis_port: $local_redis_port

  tasks:
    - name: add redis ppa
      action: apt_repository repo=ppa:rwky/redis

    - name: install redis server
      action: apt pkg=redis-server state=present update-cache=yes

    - name: create /var/action/redis
      action: shell mkdir -p /var/action/redis && chown -R redis:redis /var/action/redis

    - name: upload the populate aio:available_resources script
      action: copy src=../../../shared/files/initialize_redis.sh dest=/root/initialize_redis.sh owner=root group=root mode=0700
      only_if: "'${role}' == 'box_host' or '${role}' == 'dev'"

    - name: setup redis.conf
      action: template src=../../../shared/templates/redis.conf.j2 dest=/etc/redis/redis.conf owner=redis group=redis mode=0660
      notify: restart redis

  handlers:
    - include: ../../../shared/plays/redis/handlers/handler.yml
