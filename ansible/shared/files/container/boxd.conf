# boxd
description "boxd"

start on runlevel [2345]
stop on runlevel [!2345]

console log

respawn
respawn limit 99 5

script
  echo $$ > /var/run/boxd.pid
  exec /sbin/action/boxd
end script

pre-start script
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Starting boxd" >> /var/log/upstart/boxd.log
end script

pre-stop script
  rm /var/run/boxd.pid
  echo "[`date -u +%Y-%m-%dT%T.%3NZ`] (sys) Stopping boxd" >> /var/log/upstart/boxd.log
end script
