lxc.network.type = veth
lxc.network.flags = up
lxc.network.link = br-lxc-254
lxc.cgroup.cpu.shares = 512
lxc.cgroup.memory.limit_in_bytes = 256M

lxc.cap.drop = audit_control audit_write
lxc.cap.drop = mac_admin mac_override
lxc.cap.drop = mknod setfcap setpcap
lxc.cap.drop = sys_boot sys_module sys_nice sys_pacct sys_rawio sys_resource
lxc.cap.drop = sys_time sys_tty_config
lxc.cap.drop = sys_admin

lxc.mount.entry = /sys/fs/fuse/connections /sys/fs/fuse/connections fusectl optional 0 0
lxc.mount.entry = /sys/kernel/debug /sys/kernel/debug debugfs optional 0 0
lxc.mount.entry = /sys/kernel/security /var/lib/lxc/base_container_template/rootfs/sys/kernel/security securityfs optional 0 0
lxc.mount.entry = /run /var/lib/lxc/base_container_template/rootfs/run tmpfs noexec,nosuid,size=10%,mode=0755  0 0
lxc.mount.entry = /run/shm /var/lib/lxc/base_container_template/rootfs/dev/shm tmpfs size=65536k,rw,nosuid,nodev,noexec 0 0
