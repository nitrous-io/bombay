---
- name: check for existence of gem
  shell: bash -c "source ~/.bashrc && source ~/.bash_profile && gem list ${gem} | grep ${gem}"
  register: gem_exists
  ignore_errors: True

- name: gem install
  shell: bash -c "source ~/.bashrc && source ~/.bash_profile && gem install ${gem} --no-ri --no-rdoc"
  only_if: "len('${gem_exists.stdout}') == 0"
