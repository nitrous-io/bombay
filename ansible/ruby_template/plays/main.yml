---
- hosts: localhost
  connection: local
  sudo: true
  gather_facts: false

  vars:
    builder_container: builder_container_ruby

  tasks:
    - include: ../../shared/tasks/stop_all_templates.yml

    - name: copy create_builder_container script
      copy: src=../../shared/files/create_builder_container.sh dest=/tmp/create_builder_container.sh owner=root group=root mode=740

    - name: create builder container
      shell: /tmp/create_builder_container.sh $builder_container

    - include: ../../shared/tasks/host/setup_iptables_for_bridge_interface.yml
      with_items:
        - 254

- hosts: builder_container_ruby
  sudo: false
  gather_facts: false

  vars:
    user: action
    ruby_version: 2.1.1

  tasks:
    - include: ../../shared/tasks/container/add_default_shell_configs.yml

    - name: install LC_ALL,LANG,LANGUAGE=en_US in ${user}/.bashrc
      shell: /bin/bash -c "(grep '$item=en_US.UTF-8' /home/${user}/.bashrc) || (echo 'export $item=en_US.UTF-8' >> /home/${user}/.bashrc)"
      with_items:
        - LC_ALL
        - LANG
        - LANGUAGE
    - name: install LC_CTYPE=UTF-8
      shell: /bin/bash -c "(grep 'LC_CTYPE=UTF-8' /home/${user}/.bashrc) || (echo 'export LC_CTYPE=UTF-8' >> /home/${user}/.bashrc)"

    - include: ../../shared/tasks/install_autoparts.yml

    - name: install RVM
      shell: bash -c "curl -sSL https://get.rvm.io | bash -s stable --auto-dotfiles" chdir=/home/${user}

    - name: install ruby-${ruby_version} and set as the default
      shell: bash -c "test -d /home/${user}/.rvm && /home/${user}/.rvm/bin/rvm install ruby-${ruby_version} && /home/${user}/.rvm/bin/rvm alias create default ruby-${ruby_version}" creates=/home/${user}/.rvm/rubies/ruby-${ruby_version}/bin/ruby

    - name: remove ruby source code downloaded by RVM
      shell: bash -c "/home/${user}/.rvm/bin/rvm cleanup sources"

    - include: ../tasks/install_gem.yml gem=rails
    - include: ../../shared/tasks/install_autoparts_package.yml package=nodejs
