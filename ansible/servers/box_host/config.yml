---
sensitive_vars:
  global:
    github_private_key:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
    s3cfg:
      - name: aws_access_key_id
        prompt: AWS Access Key ID (needed to pull from stuff from S3)
      - name: aws_secret_access_key
        prompt: AWS Secret Access Key (needed to pull stuff from S3)
  box_host:
    boxer_env:
      - name: redis_store_host
        prompt: The hostname for the Redis store host used by boxer and proxee
        default: 127.0.0.1
      - name: redis_store_port
        prompt: The port for the Redis store host used by boxer and proxee
        default: 65000
      - name: redis_mq_host
        prompt: The hostname for the Redis store host used by boxer and proxee
      - name: redis_mq_port
        prompt: The port for the Redis store host used by boxer and proxee
        default: 65000
      - name: boxer_id
        prompt: Boxer ID will be used as the ID for this box host (it is the hostname for the boxhost)
      - name: environment
        prompt: The environment used by boxer (e.g. development, production, staging, etc.)
    proxee_env:
      - name: redis_store_host
        prompt: The hostname for the Redis store host used by boxer and proxee
        default: 127.0.0.1
      - name: redis_store_port
        prompt: The port for the Redis store host used by boxer and proxee
        default: 65000
      - name: start_port
        prompt: The starting point for all ports which proxee will proxy
        default: 3000
      - name: end_port
        prompt: The end point for all ports which proxee will proxy
        default: 9000
      - name: environment
        prompt: The environment used by proxee (e.g. development, production, staging, etc.)
    runtimes:
      - name: runtimes
        prompt: Replace this line with the runtimes in the format <name> '<lxc template name>' separated by a colon
        multiline: true
regions:
  - region: ap-southeast-1
    environments:
      staging:
        hostname: apse1-staging.actionbox.io
        size: m1.small
        ami: ami-e6d999b4
        block_devices:
          - DeviceName: /dev/sdf
            Ebs.SnapshotId: snap-1d909139
            Ebs.VolumeSize: 40
            Ebs.DeleteOnTermination: 'false'
          - DeviceName: /dev/sdg
            Ebs.SnapshotId: snap-1d909139
            Ebs.VolumeSize: 8
            Ebs.DeleteOnTermination: 'false'
      production:
        hostname: apse1.actionbox.io
        size: m1.small
        ami: ami-e6d999b4
        block_devices:
          - DeviceName: /dev/sdf
            Ebs.SnapshotId: snap-1d909139
            Ebs.VolumeSize: 40
            Ebs.DeleteOnTermination: 'false'
          - DeviceName: /dev/sdg
            Ebs.SnapshotId: snap-1d909139
            Ebs.VolumeSize: 8
            Ebs.DeleteOnTermination: 'false'
