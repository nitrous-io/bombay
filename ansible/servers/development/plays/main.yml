---
- hosts: 127.0.0.1
  sudo: True
  gather_facts: False
  vars_prompt:
    user: "What is your username?"
    aws_access_key: "What is your aws access key?"
    aws_secret_access_key: "What is your aws secret access key?"
  vars:
    env: development
    node_version: v0.8.12
    redis_port: 6379
    s3_bucket: bombay-apse.action.io
    gateway: 192.168.254.1

  tasks:
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml

    # Setup nginx
    - name: setup nginx
      action: copy src=../files/nginx.conf dest=/etc/nginx/nginx.conf owner=root group=root mode=0660
      notify: restart nginx

    # Setup stunnel
    - name: setup /etc/stunnel/{certs,keys} directory
      action: file path=/etc/stunnel/$item state=directory owner=root group=root mode=0770
      with_items:
       - certs
       - keys
    - name: move stunnel.pem to /etc/stunnel/certs directory
      action: copy src=../files/stunnel.pem dest=/etc/stunnel/certs/stunnel.pem owner=root group=root mode=0660
    - name: move stunnel.key to /etc/stunnel/certs directory
      action: copy src=../files/stunnel.key dest=/etc/stunnel/keys/stunnel.key owner=root group=root mode=0660
    - name: setup stunnel.conf the way we want
      action: copy src=../../../global/files/stunnel.conf dest=/etc/stunnel/stunnel.conf owner=root group=root mode=0660
    - name: setup stunnel to be enabled
      action: copy src=../../../global/files/default_stunnel4 dest=/etc/default/stunnel4 owner=root group=root mode=0660
      notify: restart stunnel

    # Setup haproxy
    - include: ../../../servers/rainbow/tasks/install_haproxy.yml

    # Setup Bridge Network
    - include: ../../../global/tasks/host/setup_bridge_network.yml gateway=$gateway

    # Install pam.d/common-session which sets limits for non-interactive sessions
    - name: install common-session in /etc/init.d/
      action: copy src=../files/pam_common-session dest=/etc/pam.d/common-session owner=root group=root mode=0644

    # Set limits for the user
    - include: ../../../global/tasks/set_limits.yml user=$user attribute=nofile value=65536

    # Configure S3 Cmd
    - name: configure s3cmd
      action: template src=../templates/s3cfg.j2 dest=/home/$user/.s3cfg owner=$user group=$user mode=0600 aws_access_key=$aws_access_key aws_secret_access_key=$aws_secret_access_key

    # Install container
    - name: mkdir /var/lib/lxc
      action: shell mkdir -p /var/lib/lxc

    - include: ../../../servers/box_host/tasks/install_action_container.yml name=ruby_container_template version=1350283256 s3_bucket=$s3_bucket

    # Install redis
    - include: ../../../global/tasks/install_redis.yml port=$redis_port

    # Initialize Redis
    - include: ../../../servers/box_host/tasks/setup_redis_init_script.yml

    # Create configs dir
    - name: create configs dir
      action: shell mkdir /home/$user/configs
      ignore_errors: True

    # Copying boxer configs
    - name: copy boxer configs
      action: copy src=../files/boxer_env.dev dest=/home/$user/configs/boxer_env.dev

    # Copying rainbow configs
    - name: copy rainbow configs
      action: copy src=../files/rainbow_env.dev dest=/home/$user/configs/rainbow_env.dev

    # Copying coach configs
    - name: copy coach configs
      action: copy src=../files/coach_env.dev dest=/home/$user/configs/coach_env.dev

    # Copying database configs
    - name: copy database configs
      action: copy src=../files/database.dev dest=/home/$user/configs/database.dev

    # Copying proxee configs
    - name: copy proxee configs
      action: copy src=../files/proxee_env.dev dest=/home/$user/configs/proxee_env.dev

    # Copying runtimes configs
    - name: copy runtimes configs
      action: copy src=../files/runtimes.dev dest=/home/$user/configs/runtimes.dev

  handlers:
    - name: restart nginx
      action: shell /etc/init.d/nginx restart
    - name: restart stunnel
      action: shell /etc/init.d/stunnel4 restart
    - name: restart redis
      action: shell /etc/init.d/redis-server restart
    - name: restart haproxy
      action: shell /etc/init.d/haproxy restart
