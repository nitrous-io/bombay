---
- hosts: 127.0.0.1
  sudo: True
  gather_facts: False
  vars_prompt:
    user: "Username"
    aws_access_key: "AWS Access Key"
    aws_secret_access_key: "AWS Secret Access Key"
    workspace: "Project directory name"
    pg_user: "Postgres username"
    pg_user_password: "Postgres user password"
  vars:
    env: development
    ruby_version: 1.9.3
    node_version: v0.8.12
    redis_port: 6379
    s3_bucket: bombay-apse.action.io
    gateway: 192.168.254.1

  tasks:
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml

    # Setup nginx
    - name: setup nginx
      action: copy src=../files/nginx.conf dest=/etc/nginx/nginx.conf owner=root group=root mode=0660
      notify: restart nginx

    # Setup stunnel
    - name: setup /etc/stunnel/{certs,keys} directory
      action: file path=/etc/stunnel/$item state=directory owner=root group=root mode=0770
      with_items:
       - certs
       - keys
    - name: move stunnel.pem to /etc/stunnel/certs directory
      action: copy src=../files/stunnel.pem dest=/etc/stunnel/certs/stunnel.pem owner=root group=root mode=0660
    - name: move stunnel.key to /etc/stunnel/certs directory
      action: copy src=../files/stunnel.key dest=/etc/stunnel/keys/stunnel.key owner=root group=root mode=0660
    - name: setup stunnel.conf the way we want
      action: copy src=../files/stunnel.conf dest=/etc/stunnel/stunnel.conf owner=root group=root mode=0660
    - name: setup stunnel to be enabled
      action: copy src=../../../global/files/default_stunnel4 dest=/etc/default/stunnel4 owner=root group=root mode=0660
      notify: restart stunnel

    # Setup haproxy
    - include: ../../../servers/rainbow/tasks/install_haproxy.yml

    # Setup Bridge Network
    - include: ../../../global/tasks/host/setup_bridge_network.yml gateway=$gateway

    # Install pam.d/common-session which sets limits for non-interactive sessions
    - name: install common-session in /etc/init.d/
      action: copy src=../files/pam_common-session dest=/etc/pam.d/common-session owner=root group=root mode=0644

    # Set limits for the user
    - include: ../../../global/tasks/set_limits.yml user=$user attribute=nofile value=65536

    # Configure S3 Cmd
    - name: configure s3cmd
      action: template src=../templates/s3cfg.j2 dest=/home/$user/.s3cfg owner=$user group=$user mode=0600 aws_access_key=$aws_access_key aws_secret_access_key=$aws_secret_access_key

    # Install container
    - name: mkdir /var/lib/lxc
      action: shell mkdir -p /var/lib/lxc

    - include: ../../../servers/box_host/tasks/install_action_container.yml name=ruby_container_template version=1350283256 s3_bucket=$s3_bucket

    # Install redis
    - include: ../../../global/tasks/install_redis.yml port=$redis_port

    # Initialize Redis
    - include: ../../../servers/box_host/tasks/setup_redis_init_script.yml
    - name: run the init script
      action: shell /tmp/initialize_redis.sh $redis_port

    # Install node with nvm
    - include: ../../../global/tasks/container/install_node_via_nvm.yml user=$user version=$node_version

    # Copy postgresql config
    - name: copy postgresql config
      action: copy src=../files/pg_hba.conf dest=/etc/postgresql/9.1/main/pg_hba.conf owner=postgres group=postgres mode=0640

    # create postgresql user
    - name: create postgresql user
      action: shell echo "CREATE ROLE ${pg_user} with CREATEDB LOGIN PASSWORD '${pg_user_password}'" | sudo -u postgres psql -U postgres
      notify: restart postgresql

    # create actionio_development db in postgresql
    - name: create {actionio_development,actionio_test,actionio_production} db
      action: shell sudo -u postgres createdb -U postgres -O $pg_user -E utf8 $item
      with_items:
       - actionio_development
       - actionio_test
       - actionio_production
      ignore_errors: True

    # Create project directory
    - name: create project directories
      action: shell mkdir /home/$user/$workspace
      ignore_errors: True

    # Clone boxer
    - name: git clone boxer
      action: shell sudo -u $user git clone git@github.com:action-io/boxer.git chdir=/home/$user/$workspace
      ignore_errors: True

    # Register boxer ip
    - name: query for ip
      action: shell curl http://169.254.169.254/latest/meta-data/public-ipv4 > /tmp/ip

    # Register boxer ip
    - name: register boxer ip
      action: shell cat /tmp/ip
      register: boxer_ip

    # Copying boxer env config
    - name: copy boxer env config
      action: template src=../templates/boxer_env.j2 dest=/home/$user/$workspace/boxer/.env owner=$user group=$user mode=0644

    # Copying boxer runtimes config
    - name: copy boxer runtimes config
      action: template src=../files/runtimes.coffee dest=/home/$user/$workspace/boxer/config/runtimes.coffee

    # Install node modules
    - name: install node modules for boxer
      action: shell /home/$user/.nvm/$node_version/bin/npm install chdir=/home/$user/$workspace/boxer

    # Clone rainbow
    - name: git clone rainbow
      action: shell sudo -u $user git clone git@github.com:action-io/rainbow.git chdir=/home/$user/$workspace
      ignore_errors: True

    # Copying rainbow env configs
    - name: copy rainbow configs
      action: copy src=../files/rainbow_env dest=/home/$user/$workspace/rainbow/.env owner=$user gourp=$user mode=0644

    # Copying rainbow database configs
    - name: copy rainbow configs
      action: template src=../templates/database.coffee.j2 dest=/home/$user/$workspace/rainbow/config/database.coffee pg_user=$pg_user pg_user_password=$pg_user_password owner=$user group=$user mode=0644

    # Install node modules
    - name: install node modules for rainbow
      action: shell sudo -u $user /home/$user/.nvm/$node_version/bin/npm install chdir=/home/$user/$workspace/rainbow

    # Clone coach
    - name: git clone coach
      action: shell sudo -u $user git clone git@github.com:action-io/coach.git chdir=/home/$user/$workspace
      ignore_errors: True

    # Initializing Git submodules
    - name: git submodule update --init
      action: shell sudo -u $user git submodule update --init chdir=/home/$user/$workspace/coach
      ignore_errors: True

    # Copying coach configs
    - name: copy coach configs
      action: copy src=../files/coach_env dest=/home/$user/$workspace/coach/.env owner=$user group=$user mode=0644

    # Install node modules
    - name: install node modules for coach
      action: shell /home/$user/.nvm/$node_version/bin/npm install chdir=/home/$user/$workspace/coach

    # Clone proxee
    - name: git clone proxee
      action: shell sudo -u $user git clone git@github.com:action-io/proxee.git chdir=/home/$user/$workspace
      ignore_errors: True

    # Copying proxee configs
    - name: copy proxee configs
      action: copy src=../files/proxee_env dest=/home/$user/$workspace/proxee/.env owner=$user group=$user mode=0644

    # Install node modules
    - name: install node modules for proxee
      action: shell /home/$user/.nvm/$node_version/bin/npm install chdir=/home/$user/$workspace/proxee

    # Clone action.io
    - name: git clone action io
      action: shell sudo -u $user git clone git@github.com:action-io/action.io.git chdir=/home/$user/$workspace
      ignore_errors: True

    # Initializing Git submodules
    - name: git submodule update --init
      action: shell sudo -u $user git submodule update --init chdir=/home/$user/$workspace/action.io
      ignore_errors: True

    # Copying env configs
    - name: copy env config
      action: copy src=../files/actionio_env dest=/home/$user/$workspace/action.io/.env owner=$user group=$user mode=0644

    # Copying database configs
    - name: copy database config
      action: template src=../templates/database.yml.j2 dest=/home/$user/$workspace/action.io/config/database.yml pg_user=$pg_user pg_user_password=$pg_user_password owner=$user group=$user mode=0644

  handlers:
    - name: restart nginx
      action: shell /etc/init.d/nginx restart
    - name: restart stunnel
      action: shell /etc/init.d/stunnel4 restart
    - name: restart redis
      action: shell /etc/init.d/redis-server restart
    - name: restart haproxy
      action: shell /etc/init.d/haproxy restart
    - name: restart postgresql
      action: shell /etc/init.d/postgresql restart
