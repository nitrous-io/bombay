---
- hosts: rainbow
  sudo: True
  gather_facts: False
  vars_files:
    - ../../../config/deploy_keys.yml
    #- ../../../config/nagios-server.yml
  vars:
    - app: rainbow
    - app_directory: /var/apps/${app}
    - deploy_user: action
    - node_version: v0.8.11
  tasks:
    # Set the hostname
    - include: ../../../global/tasks/set_hostname.yml
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../../global/tasks/install_ansible_deps.yml
    # apt-get update
    - include: ../../../global/tasks/update_apt.yml
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml
    # Install sudoers
    - include: ../../../global/tasks/install_sudoers.yml file=../files/rainbow_sudoers
    # Create Deploy User
    - include: ../../../global/tasks/create_deploy_user.yml deploy_user=$deploy_user
    # Create Capistrano Layout for $app_directory
    - include: ../../../global/tasks/create_capistrano_app_layout.yml app_directory=$app_directory deploy_user=$deploy_user
    # Setup .env
    - name: setup env
      action: copy src=../files/env.$env dest=$app_directory/shared/config/.env owner=$deploy_user group=$deploy_user mode=0600
    - name: setup database.coffee
      action: copy src=../files/database.$env dest=$app_directory/shared/config/database.coffee owner=$deploy_user group=$deploy_user mode=0600
    # Generate and Upload Public Key to GitHub
    - include: ../../../global/tasks/register_github_keys.yml deploy_user=$deploy_user
    # Setup nginx
    - name: setup nginx
      action: copy src=../files/nginx.conf dest=/etc/nginx/nginx.conf owner=root group=root mode=0660
      notify: restart nginx
    # Setup haproxy
    - include: ../tasks/install_haproxy.yml
    # Setup stunnel
    - include: ../../../global/tasks/install_stunnel.yml
    # Install NVM
    - include: ../../../global/tasks/container/install_node_via_nvm.yml version=$node_version user=$deploy_user
    # Install Upstart
    - include: ../../../global/tasks/install_upstart_for_app.yml app=$app deploy_user=$deploy_user node_version=$node_version
    # Install nagios nrpe server
    #- include: ../../../global/tasks/install_nagios_nrpe_server.yml
  handlers:
    - name: restart nginx
      action: shell /etc/init.d/nginx restart
    - name: restart haproxy
      action: shell /etc/init.d/haproxy restart
    - name: restart stunnel
      action: shell /etc/init.d/stunnel4 restart

# copy the host config to the nagios server
#- include: ../../../global/playbooks/add_host_configurations_to_nagios.yml
