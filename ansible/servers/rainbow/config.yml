---
sensitive_vars:
  global:
    github_private_key:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
    stunnel_key:
      - name: stunnel_key
        prompt: Replace this line with the Action.IO SSL Private Key used in Stunnel
        multiline: true
    stunnel_pem:
      - name: stunnel_cert
        prompt: Replace this line with the Action.IO SSL Cert used in Stunnel
        multiline: true
  rainbow:
    env:
      - name: secret_token
        prompt: The Secret Token used in the Rails app (look at the Heroku Config to get this)
      - name: environment
        prompt: The environment used by rainbow (e.g. development, production, staging, etc.)
      - name: cors_allowed_origin
        prompt: The domain you want to allow for CORS (e.g. https://staging.action.io, https://www.action.io)
      - name: socketio_allowed_origin
        prompt: The domains you want to allow for socket.io (e.g. https://staging.action.io, https://www.action.io)
    database:
      - name: environment
        prompt: The environment used by rainbow (e.g. development, production, staging, etc.)
      - name: pg_user
        prompt: The postgres username (used by the Rails app, get it from Heroku)
      - name: pg_password
        prompt: The postgres password (used by the Rails app, get it from Heroku)
      - name: pg_hostname
        prompt: The postgres host (used by the Rails app, get it from Heroku)
      - name: pg_port
        prompt: The postgres port (used by the Rails app, get it from Heroku)
        default: 5432
      - name: pg_database
        prompt: The postgres database (used by the Rails app, get it from Heroku)
regions:
  - region: ap-southeast-1
    environments:
      staging:
        hostname: rainbow-apse1-staging.action.io
        size: m1.small
        ami: ami-e6d999b4
      production:
        hostname: rainbow-apse1.action.io
        size: m1.small
        ami: ami-e6d999b4
