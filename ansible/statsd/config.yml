---
sensitive_vars:
  librato_email:
    context: global
    vars:
      - name: librato_email
        prompt: Replace this line with the librato account's email
        multiline: false
  librato_token:
    context: global
    vars:
      - name: librato_token
        prompt: Replace this line with the librato account's token
        multiline: false

regions:
  - region: ap-southeast-1
    environments:
      staging:
        servers:
          - hostname: statsd-apse1-staging.action.io
            size: m1.small
            ami: ami-e6d999b4
      production:
        servers:
          - hostname: statsd-apse1.action.io
            size: m1.small
            ami: ami-e6d999b4

  - region: us-west-1
    environments:
      staging:
        servers:
          - hostname: statsd-usw1-staging.action.io
            size: m1.small
            ami: ami-977b5dd2
      production:
        servers:
          - hostname: statsd-usw1.action.io
            size: m1.small
            ami: ami-977b5dd2

  - region: us-east-1
    environments:
      staging:
        servers:
          - hostname: statsd-use1-staging.action.io
            size: m1.small
            ami: ami-e6d999b4
      production:
        servers:
          - hostname: statsd-use1.action.io
            size: m1.small
            ami: ami-e6d999b4
