---
sensitive_vars:
  librato_email:
    context: global
    vars:
      - name: librato_email
        prompt: Replace this line with the librato account's email
        multiline: false
  librato_token:
    context: global
    vars:
      - name: librato_token
        prompt: Replace this line with the librato account's token
        multiline: false

  diamond:
    context: environment
    vars:
      - name: librato_email
        prompt: Email address for the Librato Account you want to send stats to
      - name: librato_api_key
        prompt: API Key for the Librato Account you want to send stats to

regions:
  - region: ap-southeast-1
    environments:
      production:
        servers:
          - hostname: statsd-apse1.action.io
            size: m1.small
            ami: ami-e6d999b4

  - region: us-west-1
    environments:
      production:
        servers:
          - hostname: statsd-usw1.action.io
            size: m1.small
            ami: ami-977b5dd2

  - region: us-east-1
    environments:
      production:
        servers:
          - hostname: statsd-use1.action.io
            size: m1.small
            ami: ami-8b4dc4e2

  - region: eu-west-1
    environments:
      production:
        servers:
          - hostname: statsd-euw1.action.io
            size: m1.small
            ami: ami-7a202f0e

  - region: sa-east-1
    environments:
      production:
        servers:
          - hostname: statsd-sae1.action.io
            size: m1.small
            ami: ami-09508814

