---
- hosts: all
  sudo: True
  gather_facts: False

  vars_files:
    - ../../vars_files/librato_email.yml
    - ../../vars_files/librato_token.yml

  vars:
    app: statsd
    deploy_user: app_runner
    app_directory: /var/apps/${app}
    git_remote: git://github.com/etsy/statsd.git
    node_version: v0.8.11

  tasks:
    # Create Deploy User
    - include: ../../shared/tasks/create_deploy_user.yml
    # Add lines to security limits.conf
    - include: ../../shared/tasks/add_line_to_limits_conf.yml line=$item
      with_items:
        - "app_runner           -       nofile         1048576"
    # Install Node via NVM
    - include: ../../shared/tasks/container/install_node_via_nvm.yml version=$node_version user=$deploy_user
    # Install capp script
    - name: install cap.sh for statsd
      template: src=../templates/cap.sh.j2 dest=/usr/local/bin/cap owner=$deploy_user group=$deploy_user mode=0700
    # Create Capistrano Layout
    - include: ../../shared/tasks/create_capistrano_app_layout.yml
    # Deploy boxer using capistrano technique
    - name: deploy statsd
      shell: su $deploy_user -c '/usr/local/bin/cap statsd git://github.com/etsy/statsd.git'
    # Copy config over
    - name: copy statsd config
      template: src=../templates/statsd-localConfig.js.j2 dest=/var/apps/${app}/current/localConfig.js
    # Install upstart
    - name: install upstart
      action: apt pkg=upstart state=present
    # Copy upstart script
    - name: install upstart script in /etc/init
      action: template src=../templates/upstart.conf.j2 dest=/etc/init/${app}.conf
    # Install a script which does upstart restarts
    - include: ../../shared/tasks/install_upstart_node.yml
    # Restart statsd
    - name: restart statsd
      action: shell /usr/local/bin/upstart_node ${app}
