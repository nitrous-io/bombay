---
- hosts: base_container_template
  sudo: True
  gather_facts: False

  tasks:
    - name: Install Keys needed to access certain pkg repositories
      # mongodb
      shell: apt-key adv --keyserver keyserver.ubuntu.com --recv 7F0CEB10

    - name: Add source lines for all the templates
      # mongodb
      template: src=../../shared/templates/container/10gen.list.j2 dest=/etc/apt/sources.list.d/10gen.list

    - include: ../../shared/tasks/add_repository.yml repo=ppa:pitti/postgresql

    - name: Run apt-get update after everything
      shell: apt-get update

    - name: Absolute essential packages for the container (via apt)
      apt: pkg=$item state=latest
      with_items:
      - iptables
      - gawk
      - libgdbm-dev
      - bison
      - libffi-dev
      - build-essential
      - wget
      - curl
      - libcurl3
      - libcurl3-gnutls
      - libcurl4-openssl-dev
      - libsqlite3-dev
      - sqlite3
      - libpq-dev
      - postgresql-client-9.2
      - libmysqlclient-dev
      - mysql-client
      - mongodb-clients
      - imagemagick
      - libmagickwand-dev
      - libmagickcore-dev
      - libyaml-dev
      - openssl
      - libreadline6-dev
      - man-db
      - ssh
      - nano
      - emacs23-nox
      - vim-nox
      - tmux
      - screen
      - libxml2-dev
      - libxml2
      - libxslt1-dev
      - libbz2-1.0
      - libbz2-dev
      - libncurses5-dev
      - libncursesw5-dev
      - libssl1.0.0
      - libssl-dev
      - libssl-doc
      - automake
      - autotools-dev
      - base-files
      - base-passwd
      - binutils
      - bzip2
      - file
      - gnupg
      - libdb5.1
      - libdb5.1-dev
      - libevent-1.4-2
      - libevent-core-1.4-2
      - libevent-dev
      - libevent-extra-1.4-2
      - libglib2.0-dev
      - libglib2.0-dev
      - libldap-2.4-2
      - libldap2-dev
      - libltdl-dev
      - libltdl7
      - liblzma5
      - liblzma-dev
      - liblzma-doc
      - libarchive12
      - libarchive-dev
      - zlib1g
      - zlib1g-dev
      - xz-utils
      - whiptail
      - util-linux
      - tzdata
      - tzdata-java
      - tsconf
      - strace
      - libncap-dev
      - libncap44
      - libxt6
      - libxt-dev
      - libpng12-0
      - libpng12-dev
      - libqt4-dev
      - unzip
      - unison
      - ack-grep
      - traceroute
      - git-core
      - git-svn
      - mercurial
      - subversion
      - bzr
      - psmisc
      - libpam0g-dev
      - zsh
      - zsh-dev
      - dnsutils
      - ruby1.9.1-dev
      - gdb
      - libsndfile1-dev
      - cmake
      - libicu-dev
      - telnet
      - zip

    - name: symlink ack-grep to ack
      shell: ln -s /usr/bin/ack-grep /usr/local/bin/ack
      ignore_errors: True

    # delete mysql server conf which is undesirably placed by mysql-common package
    - name: Delete my.conf
      shell: rm -f /etc/mysql/my.cnf
      ignore_errors: True
