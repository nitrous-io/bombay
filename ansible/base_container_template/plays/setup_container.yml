---
- hosts: base_container_template
  sudo: True
  gather_facts: False
  vars:
    user: action

  tasks:
    # apt-get update
    - include: ../../shared/tasks/update_apt.yml
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../shared/tasks/install_ansible_deps.yml
    # Configure SSH
    - include: ../../shared/tasks/container/configure_sshd_config.yml
    # Remove ubuntu user from the container
    - include: ../../shared/tasks/container/remove_ubuntu_user.yml

# Install essential core packages for all containers
- include: ./install_packages.yml

- hosts: base_container_template
  sudo: True
  gather_facts: False
  vars:
    user: action

  tasks:
    # Install pam-action.so
    - include: ../../shared/tasks/container/install_pam_action.yml
    # Install boxd
    - include: ../../shared/tasks/container/install_boxd.yml
    # Install redis-client
    - include: ../../shared/tasks/install_redis_client_from_source.yml
    # Install java
    - include: ../../shared/tasks/install_java.yml
    # Install locales
    - include: ../../shared/tasks/container/install_locales.yml
    # Sane Security Limits for the user
    - include: ../../shared/tasks/container/install_security_limits.yml
    # Install heroku toolbelt
    - include: ../../shared/tasks/install_heroku_toolbelt.yml
    # Symlink /rootfs to / so share dependencies work
    - name: symlink /rootfs to /
      shell: ln -s / /rootfs
      ignore_errors: True
    - name: make /run/shm writable for everyone
      shell: chmod -R 777 /run/shm
