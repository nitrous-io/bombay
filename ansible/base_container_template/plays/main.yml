---
- hosts: localhost
  connection: local
  sudo: true
  gather_facts: false

  vars:
    builder_container: builder_container_ruby

  tasks:
    - include: ../../shared/tasks/stop_all_templates.yml

- include: ./setup_bombay_ssh_keys.yml
- include: ./create_container.yml
- include: ./setup_container.yml
- include: ./update_packages.yml
- include: ./install_phantomjs.yml
- include: ./install_python.yml
- include: ./set_etc_environment.yml
- include: ./set_ruby_19_as_default.yml
- include: ./install_puppet.yml
- include: ./install_chef_config.yml
- include: ./disable_cron_jobs.yml
- include: ./disable_rsyslogd.yml

- hosts: base_container_template
  sudo: False
  gather_facts: False

  tasks:
    - include: ../../shared/tasks/container/install_system_gem.yml gem=bundler
    - include: ../../shared/tasks/container/install_system_gem.yml gem=rake
    - include: ../../shared/tasks/container/install_system_gem.yml gem=chef

- hosts: base_container_template
  sudo: True
  gather_facts: False

  tasks:
    - include: ../../shared/tasks/install_parse.yml

- include: ./disable_sudo.yml
- include: ./block_ec2_metadata.yml
- include: ./post_create.yml
