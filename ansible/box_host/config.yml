---
sensitive_vars:
  github_private_key:
    context: global
    vars:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true

  s3cfg:
    context: global
    vars:
      - name: aws_access_key_id
        prompt: AWS Access Key ID (needed to pull from stuff from S3)
      - name: aws_secret_access_key
        prompt: AWS Secret Access Key (needed to pull stuff from S3)

  boxer_airbrake_key:
    context: environment
    vars:
      - name: boxer_airbrake_key
        prompt: Airbrake API Key for Boxer

  proxee_airbrake_key:
    context: environment
    vars:
      - name: proxee_airbrake_key
        prompt: Airbrake API Key for Proxee

  diamond:
    context: environment
    vars:
      - name: librato_email
        prompt: Email address for the Librato Account you want to send stats to
      - name: librato_api_key
        prompt: API Key for the Librato Account you want to send stats to

server_vars:
  local_redis_host: 127.0.0.1
  local_redis_port: 65000
  redis_mq_port: 65000
  proxee_start_port: 3000
  proxee_end_port: 9000

regions:
  - region: ap-southeast-1
    environments:
      staging:
        server_vars:
          redis_mq_host: coach-apse1-staging.action.io
        servers:
          - hostname: apse1-staging.actionbox.io
            size: m1.small
            ami: ami-e6d999b4
            server_vars:
              boxer_runtimes: "{ 'rails': 'ruby_container_template', 'nodejs': 'nodejs_container_template', 'django': 'python_container_template', 'go': 'golang_container_template' }"
            block_devices:
              - DeviceName: /dev/sdf
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 40
                Ebs.DeleteOnTermination: 'false'
              - DeviceName: /dev/sdg
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 8
                Ebs.DeleteOnTermination: 'false'

      production:
        server_vars:
          redis_mq_host: coach-apse1.action.io
        servers:
          - hostname: apse1.actionbox.io
            size: m1.small
            ami: ami-e6d999b4
            server_vars:
              boxer_runtimes: "{ 'rails': 'ruby_container_template', 'nodejs': 'nodejs_container_template', 'django': 'python_container_template', 'go': 'golang_container_template' }"
            block_devices:
              - DeviceName: /dev/sdf
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 40
                Ebs.DeleteOnTermination: 'false'
              - DeviceName: /dev/sdg
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 8
                Ebs.DeleteOnTermination: 'false'

  - region: us-west-1
    environments:
      staging:
        server_vars:
