---
- hosts: all
  sudo: True
  gather_facts: False

  vars:
    s3_bucket: bombay-apse.action.io

  tasks:
    # Install ruby template
    - include: ../tasks/install_action_template.yml name=ruby_template version=1363164004 s3_bucket=$s3_bucket
    # Install nodejs template
    - include: ../tasks/install_action_template.yml name=nodejs_template version=1359616280 s3_bucket=$s3_bucket
    # Install python template
    - include: ../tasks/install_action_template.yml name=python_template version=1362025115 s3_bucket=$s3_bucket
    # Install golang template
    - include: ../tasks/install_action_template.yml name=golang_template version=1362018598 s3_bucket=$s3_bucket

