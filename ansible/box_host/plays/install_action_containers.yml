---
- hosts: box_host
  sudo: True
  gather_facts: False

  vars:
    s3_bucket: bombay-apse.action.io

  tasks:
    # install base container
    
    - include: ../tasks/install_action_container.yml name=base_container_template version=1359343370 s3_bucket=$s3_bucket
    # Install ruby template
    - include: ../tasks/install_action_template.yml name=ruby_template version=1359295134 s3_bucket=$s3_bucket
    # Install nodejs template
    - include: ../tasks/install_action_template.yml name=nodejs_template version=1359100258 s3_bucket=$s3_bucket
    # Install python template
    - include: ../tasks/install_action_template.yml name=python_template version=1359100068 s3_bucket=$s3_bucket
    # Install golang template
    - include: ../tasks/install_action_template.yml name=golang_template version=1359101127 s3_bucket=$s3_bucket

