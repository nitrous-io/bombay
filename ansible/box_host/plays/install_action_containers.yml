---
- hosts: box_host
  sudo: True
  gather_facts: False
  tasks:
    # Install ruby container
    - include: ../tasks/install_action_container.yml name=ruby_template version=1359295134 s3_bucket=$s3_bucket
    # Install nodejs container
    - include: ../tasks/install_action_container.yml name=nodejs_template version=1359100258 s3_bucket=$s3_bucket
    # Install python container
    - include: ../tasks/install_action_container.yml name=python_template version=1359100068 s3_bucket=$s3_bucket
    # Install golang container
    - include: ../tasks/install_action_container.yml name=golang_template version=1359101127 s3_bucket=$s3_bucket

