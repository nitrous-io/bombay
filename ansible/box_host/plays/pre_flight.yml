---
- hosts: box_host
  sudo: True
  gather_facts: False
  tasks:
    # Set the hostname
    - include: ../../shared/tasks/set_hostname.yml
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../shared/tasks/install_ansible_deps.yml
    # apt-get update
    - include: ../../shared/tasks/update_apt.yml
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml
    # Set LXC defaults
    - name: set lxc defaults
      template: src=../../shared/templates/lxc_default.j2 dest=/etc/default/lxc owner=root group=root mode=0600

