---
- hosts: box_host
  sudo: True
  gather_facts: False
  vars_files:
    - ../../vars_files/s3cfg.yml

  vars:
    s3_bucket: bombay-apse.action.io

  tasks:
    - name: mkdir /var/lib/lxc
      action: shell mkdir -p /var/lib/lxc

    - name: mount /dev/xvdf
      action: mount name=/var/lib/lxc src=/dev/xvdf fstype=xfs opts=defaults,nouuid,prjquota,comment=cloudconfig state=mounted

    - name: mkdir /var/action
      action: shell mkdir -p /var/action

    - name: mount /dev/xvdg
      action: mount name=/var/action src=/dev/xvdg fstype=xfs opts=defaults,nouuid,comment=cloudconfig state=mounted

    # Set the hostname
    - include: ../../shared/tasks/set_hostname.yml

    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../shared/tasks/install_ansible_deps.yml

    # Setup Bridge Network
    - name: Update /etc/network/interfaces
      # Paths are relative to the containers/${container_template}/plays directory
      action: template src=../../shared/templates/host/network_config.j2 dest=/etc/network/interfaces owner=root group=root mode=0664 backup=yes

    - include: ../../shared/tasks/host/ifup_bridge_network.yml bridge=$item
      with_items:
        - br-lxc
        - br-lxc-253
        - br-lxc-252
        - br-lxc-251
        - br-lxc-250
        - br-lxc-249
        - br-lxc-248
        - br-lxc-247
        - br-lxc-246
        - br-lxc-245
        - br-lxc-244

    - include: ../../shared/tasks/host/setup_iptables_for_bridge_interface.yml
      with_items:
        - 254
        - 253
        - 252
        - 251
        - 250
        - 249
        - 248
        - 247
        - 246
        - 245
        - 244
    # apt-get update
    - include: ../../shared/tasks/update_apt.yml
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml
    # Grow the /dev/sdf partition
    - name: xfs_growfs /dev/xvdf
      action: shell xfs_growfs /dev/xvdf
    # Grow the /dev/sdg partition
    - name: xfs_growfs /dev/xvdg
      action: shell xfs_growfs /dev/xvdg
    # Install pam.d/common-session which sets limits for non-interactive sessions
    - name: install common-session in /etc/init.d/
      action: copy src=../../shared/files/pam_common-session dest=/etc/pam.d/common-session owner=root group=root mode=0644
    # Set limits for the user
    - include: ../../shared/tasks/set_limits.yml
    # Install Redis Server
    - include: ../../shared/tasks/install_redis_with_resources.yml redis_port=$local_redis_port
    # Configure S3 Cmd
    - include: ../../shared/tasks/configure_s3cmd.yml
    # Install ruby container
    - include: ../tasks/install_action_container.yml name=ruby_container_template version=1353987451 s3_bucket=$s3_bucket
    # Install nodejs container
    - include: ../tasks/install_action_container.yml name=nodejs_container_template version=1353995398 s3_bucket=$s3_bucket
    # Install python container
    - include: ../tasks/install_action_container.yml name=python_container_template version=1353988799 s3_bucket=$s3_bucket
    # Install golang container
    - include: ../tasks/install_action_container.yml name=golang_container_template version=1353996298 s3_bucket=$s3_bucket

  handlers:
    - name: restart redis
      action: shell /etc/init.d/redis-server restart
      notify: initialize redis
    - name: initialize redis
      action: shell /tmp/initialize_redis.sh $local_redis_port
      notify: restart server
      # restart server after the very first provisioning, so that iptables etc. will be setup correctly
    - name: restart server
      action: shell bash -c "test -f /root/bootstrapped || (touch /root/bootstrapped && reboot)"

- include: deploy.yml
- include: ../../shared/plays/papertrail/install.yml
- include: ../../shared/plays/monit/install_monit_client.yml
- include: ../../shared/plays/diamond/install_diamond.yml
