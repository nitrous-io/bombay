---
- hosts: box_host
  sudo: True
  gather_facts: False

  vars:
    redis_port: $local_redis_port

  tasks:
    - name: copy migration home script
      copy: src=../files/migrate_box_name.rb dest=/root/migrate_box_name.rb owner=root group=root mode=740
    - name: copy set swap + workspace script
      copy: src=../files/add_swap_and_workspace_to_boxes.rb dest=/root/add_swap_and_workspace_to_boxes.rb owner=root group=root mode=740

