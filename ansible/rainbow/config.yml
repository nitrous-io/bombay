---
sensitive_vars:
  github_private_key:
    context: global
    vars:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
  stunnel_key:
    context: global
    vars:
      - name: stunnel_key
        prompt: Replace this line with the Action.IO SSL Private Key used in Stunnel
        multiline: true
  stunnel_pem:
    context: global
    vars:
      - name: stunnel_cert
        prompt: Replace this line with the Action.IO SSL Cert used in Stunnel
        multiline: true
  rainbow:
    context: environment
    vars:
      - name: rainbow_secret_token
        prompt: The Secret Token used in the Rails app (look at the Heroku Config to get this)
      - name: rainbow_database_username
        prompt: The postgres username (used by the Rails app, get it from Heroku)
      - name: rainbow_database_password
        prompt: The postgres password (used by the Rails app, get it from Heroku)
      - name: rainbow_aes_key
        prompt: The AES key used by the Rails app to encrypt stuff in the database
      - name: rainbow_airbrake_key
        prompt: Airbrake API Key used by Rainbow

regions:
  - region: ap-southeast-1
    environments:
      staging:
        server_vars:
          rainbow_cors_allowed_origin: https://staging.action.io
          rainbow_socketio_allowed_origin: https://staging.action.io:*
          rainbow_database_hostname: ec2-23-23-234-207.compute-1.amazonaws.com
          rainbow_database_port: 5432
          rainbow_database_name: d3q8t99tlthbos
        servers:
          - hostname: rainbow-apse1-staging.action.io
            size: m1.small
            ami: ami-e6d999b4

      production:
        server_vars:
          rainbow_cors_allowed_origin: https://www.action.io
          rainbow_socketio_allowed_origin: https://www.action.io:*
          rainbow_database_hostname: ec2-23-23-180-243.compute-1.amazonaws.com
          rainbow_database_port: 5632
          rainbow_database_name: d9ij1rf0084388
        servers:
          - hostname: rainbow-apse1.action.io
            size: m1.small
            ami: ami-e6d999b4

