---
- hosts: rainbow
  sudo: True
  gather_facts: False

  tasks:
    # Set the hostname
    - include: ../../shared/tasks/set_hostname.yml
    # python-apt && python-software-properties needed for ansible and can't be installed via the apt module
    - include: ../../shared/tasks/install_ansible_deps.yml
    # apt-get update
    - include: ../../shared/tasks/update_apt.yml
    # Install Dependencies (via apt-get)
    - include: ../tasks/install_deps.yml
    # Install pam.d/common-session which sets limits for non-interactive sessions
    - name: install common-session in /etc/init.d/
      action: copy src=../../shared/files/pam_common-session dest=/etc/pam.d/common-session owner=root group=root mode=0644
    # Set limits for the user
    - include: ../../shared/tasks/set_limits.yml
    # Setup nginx
    - name: setup nginx
      action: copy src=../files/nginx.conf dest=/etc/nginx/nginx.conf owner=root group=root mode=0660
      notify: restart nginx
    # Setup haproxy
    - include: ../tasks/install_haproxy.yml

  handlers:
    - name: restart nginx
      action: shell /etc/init.d/nginx restart
    - name: restart haproxy
      action: shell /etc/init.d/haproxy restart

- include: setup_stunnel.yml
- include: deploy.yml
- include: ../../shared/plays/papertrail/install.yml
- include: ../../shared/plays/monit/install_monit_client.yml
- include: ../../shared/plays/diamond/install_diamond.yml

