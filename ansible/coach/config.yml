---
vars_files:
  github_private_key:
    context: global
    vars:
      - name: github_key
        prompt: Replace this line with the private key used by the box to pull from GitHub repos
        multiline: true
  stunnel_key:
    context: global
    vars:
      - name: stunnel_key
        prompt: Replace this line with the Action.IO SSL Private Key used in Stunnel
        multiline: true
  stunnel_pem:
    context: global
    vars:
      - name: stunnel_cert
        prompt: Replace this line with the Action.IO SSL Cert used in Stunnel
        multiline: true
  coach:
    context: environment
    vars:
      - name: webhook_username
        prompt: The username used in basic auth for the webhook host (check Heroku config for the webhook host to get it)
      - name: webhook_password
        prompt: The password used in basic auth for the webhook host (check Heroku config for the webhook host to get it)
      - name: coach_username
        prompt: The username used in basic auth for the coach (remember to set the same username in the Heroku config for the webhook host)
      - name: coach_password
        prompt: The password used in basic auth for the coach (remember to set the same password in the Heroku config for the webhook host)
      - name: coach_airbrake_key
        prompt: Airbrake API Key used by Coach

host_vars:
  coach:
    - name: redis_host
      value: 127.0.0.1
    - name: redis_port
      value: 65000

regions:
  - region: ap-southeast-1
    environments:
      staging:
        host_vars:
          coach:
            - name: webhook_host
              value: https://staging.action.io
        hosts:
          - hostname: coach-apse1-staging.action.io
            size: m1.small
            ami: ami-e6d999b4
            block_devices:
              - DeviceName: /dev/sdg
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 8
                Ebs.DeleteOnTermination: 'false'
      production:
        host_vars:
          coach:
            - name: webhook_host
              value: https://www.action.io
        hosts:
          - hostname: coach-apse1.action.io
            size: m1.small
            ami: ami-e6d999b4
            block_devices:
              - DeviceName: /dev/sdg
                Ebs.SnapshotId: snap-1d909139
                Ebs.VolumeSize: 8
                Ebs.DeleteOnTermination: 'false'
  - region: us-west-1
    environments:
      staging:
        host_vars:
          coach:
            - name: webhook_host
              value: https://staging.action.io
        hosts:
          - hostname: coach-usw1-staging.action.io
            size: m1.small
            ami: ami-977b5dd2
            block_devices:
              - DeviceName: /dev/sdg
                Ebs.SnapshotId: snap-566c3c7a
                Ebs.VolumeSize: 8
                Ebs.DeleteOnTermination: 'false'
      production:
        host_vars:
          coach:
            - name: webhook_host
              value: https://www.action.io
        hosts:
          - hostname: coach-usw1.action.io
            size: m1.small
            ami: ami-977b5dd2
            block_devices:
              - DeviceName: /dev/sdg
                Ebs.SnapshotId: snap-566c3c7a
                Ebs.VolumeSize: 8
                Ebs.DeleteOnTermination: 'false'
