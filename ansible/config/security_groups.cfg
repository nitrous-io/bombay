; format is:  port-range<tab>protocol<tab>source
; if you want to allow all sources, then specify the source to be 0.0.0.0/0
[rainbow]
; ssl
443 tcp 0.0.0.0/0
; ssh
65100 tcp 0.0.0.0/0

[box_host]
; http ports for servers
3000-9000 tcp 0.0.0.0/0
; ssh ports for boxes
10000-20000 tcp 0.0.0.0/0
; ssh
65100 tcp 0.0.0.0/0

[coach]
; ssl
443 tcp 0.0.0.0/0
; redis
65000 tcp box_host
; ssh
65100 tcp 0.0.0.0/0
; e.g. by ip
; 65200 tcp 192.168.254.1

