---
- name: install nagios nrpe server
  action: apt pkg=$item
  with_items:
    - nagios-nrpe-server
- name: copy the check memory script to nrpe plugins
  action: copy src=../../../global/files/check_mem.pl dest=/usr/lib/nagios/plugins/check_mem.pl owner=root group=root mode=0755
- name: copy the nrpe configuration
  action: template src=../../../global/templates/nrpe.cfg.j2 dest=/etc/nagios/nrpe.cfg nagios_server_ip=$nagios_server_ip user=root group=root mode=0644
- name: restart nrpe server
  action: shell /etc/init.d/nagios-nrpe-server restart