---
- hosts: ${hosts}
  user: ${user}
  sudo: True

  tasks:
    - name: install monit
      action: apt pkg=monit state=present

    - name: install main monit config
      action: template src=../monit/templates/monitrc.j2 dest=/etc/monit/monitrc state=file owner=root group=root mode=0644
      notify: restart monit

    - name: get hostname
      action: command /bin/bash -c 'hostname'
      register: hostname
  
    # covers CPU and system mammary.
    - name: install global system monitoring config
      action: template src=../monit/templates/system-monit.j2 dest=/etc/monit/conf.d/system-monit state=file owner=root group=root mode=0644
      notify: restart monit
    
    - name: install root disk monitoring config
      action: copy src=../monit/files/root-disk-space-monit dest=/etc/monit/conf.d/disk-space-monit state=file owner=root group=root mode=0644
      notify: restart monit

    # nginx
    - name: check if nginx is installed
      action: shell /bin/bash -c 'dpkg -l | grep -c nginx'
      register: has_nginx
      ignore_errors: True
    
    - name: install nginx monitoring config
      action: template src=../monit/templates/nginx-monit.j2 dest=/etc/monit/conf.d/nginx-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_nginx.stdout} == 0"
    
    # haproxy
    - name: check if haproxy is installed
      action: shell /bin/bash -c 'dpkg -l | grep -c haproxy'
      register: has_haproxy
      ignore_errors: True

    - name: install haproxy monitoring config
      action: template src=../monit/templates/haproxy-monit.j2 dest=/etc/monit/conf.d/haproxy-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_haproxy.stdout} == 0"
   
    # custom disks - /var/lib/lxc 
    - name: check if /var/lib/lxc is present
      action: shell /bin/bash -c 'mount | grep -c /var/lib/lxc'
      register: has_lxc_dir
      ignore_errors: True
    
    - name: install /var/lib/lxc disk monitoring config
      action: template src=../monit/templates/var-lib-lxc-disk-monit.j2 dest=/etc/monit/conf.d/lxc-dir-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_lxc_dir.stdout} == 0"
   
    # custom disks - /var/action 
    - name: check if /var/action is present
      action: shell /bin/bash -c 'mount | grep -c /var/action'
      register: has_action_dir
      ignore_errors: True
    
    - name: install /var/action disk monitoring config
      action: template src=../monit/templates/var-action-disk-monit.j2 dest=/etc/monit/conf.d/action-dir-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_action_dir.stdout} == 0"
    
    # node.js apps
    include: ../tasks/node-monit.yml node_app=rainbow
    include: ../tasks/node-monit.yml node_app=coach
    include: ../tasks/node-monit.yml node_app=proxee
    include: ../tasks/node-monit.yml node_app=boxer

    # stunnel check
    - name: check if stunnel is installed
      action: shell /bin/bash -c 'dpkg -l | grep -c stunnel'
      register: has_stunnel
      ignore_errors: True

    - name: install stunnel monitoring config
      action: copy src=../monit/files/stunnel-monit dest=/etc/monit/conf.d/stunnel-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_stunnel.stdout} == 0"

    # sshd check
    - name: check if openssh-server is installed
      action: shell /bin/bash -c 'dpkg -l | grep -c openssh-server'
      register: has_sshd
      ignore_errors: True

    - name: install sshd monitoring config
      action: copy src=../monit/files/sshd-monit dest=/etc/monit/conf.d/sshd-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_sshd.stdout} == 0"
    
    # redis check
    - name: check if redis-server is installed
      action: shell /bin/bash -c 'dpkg -l | grep -c redis-server'
      register: has_redis
      ignore_errors: True

    - name: install redis monitoring config
      action: copy src=../monit/templates/redis-monit.j2 dest=/etc/monit/conf.d/redis-monit state=file owner=root group=root mode=0644
      notify: restart monit
      only_if: "${has_redis.stdout} == 0"
    
  handlers:
    - include: ../monit/handlers/handler.yml
