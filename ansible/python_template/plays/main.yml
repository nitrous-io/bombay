---
- hosts: localhost
  connection: local
  sudo: true
  gather_facts: false

  vars:
    builder_container: builder_container_python

  tasks:
    - include: ../../shared/tasks/stop_all_templates.yml

    - name: copy create_builder_container script
      copy: src=../../shared/files/create_builder_container.sh dest=/tmp/create_builder_container.sh owner=root group=root mode=740

    - name: create builder container
      shell: /tmp/create_builder_container.sh $builder_container

    - include: ../../shared/tasks/host/setup_iptables_for_bridge_interface.yml
      with_items:
        - 254

- hosts: builder_container_python
  sudo: false
  gather_facts: false

  vars:
    user: action
    ruby_version: 2.0.0-p195
    node_version: v0.10.11

  tasks:
    - include: ../../shared/tasks/container/add_default_shell_configs.yml

    - name: install python system package
      command:  /usr/bin/python /usr/local/bin/pip install --user ${item}
      with_items:
        - distribute==0.6.43
        - Django==1.5.1
        - Fabric==1.6.1
        - Flask==0.9
        - jinja2==2.7
        - lxml==3.2.1
        - markupsafe==0.15
        - numpy==1.7.1
        - PIL==1.1.7
        - PyAMF==0.6.1
        - pycrypto==2.6
        - setuptools==0.6c11
        - webapp2==2.5.2
        - webob==1.2.3
        - PyYAML==3.10
        - mysql-python==1.2.4
        - psycopg2==2.5

    # make sure to remove .pip remnants from userspace. Ideally this should be
    # clean when you create a new box
    - name: Remove .pip from userspace
      command: rm -rf /home/action/.pip
      ignore_errors: True # when .pip does not exist

    - name: Recreate .pip folder for pip settings
      command: mkdir -p /home/action/.pip
      ignore_errors: True

    - name: make sure that pip.conf is gone
      file: path=/home/action/.pip/pip.conf state=absent

    - include: ../../shared/tasks/install_app_engine.yml
      vars:
        appengine_container: google_appengine_1.8.1.zip
        appengine_version: 1.8.1

    - name: add .bashrc
      copy: src=../files/bashrc dest=/home/$user/.bashrc owner=$user group=$user mode=0644

    - include: ../../shared/tasks/install_autoparts.yml
    - include: ../../shared/tasks/install_global_autoparts_packages.yml

