---
- hosts: localhost
  connection: local
  sudo: true
  gather_facts: false

  vars:
    builder_container: builder_container_python

  tasks:
    - include: ../../shared/tasks/stop_all_templates.yml

    - name: copy create_builder_container script
      copy: src=../../shared/files/create_builder_container.sh dest=/tmp/create_builder_container.sh owner=root group=root mode=740

    - name: create builder container
      shell: /tmp/create_builder_container.sh $builder_container

    - include: ../../shared/tasks/host/setup_iptables_for_bridge_interface.yml
      with_items:
        - 254

- hosts: builder_container_python
  sudo: false
  gather_facts: false

  vars:
    user: action
    ruby_version: 2.0.0-p195
    node_version: v0.10.11

  tasks:
    - include: ../../shared/tasks/container/add_default_shell_configs.yml
    - include: ../../shared/tasks/install_autoparts.yml
    - include: ../../shared/tasks/install_global_autoparts_packages.yml
    - include: ../../shared/tasks/install_autoparts_package.yml package=googleappengine
    - include: ../../shared/tasks/install_autoparts_package.yml package=python2
    - include: ../../shared/tasks/install_autoparts_package.yml package=pip
    - include: ../../shared/tasks/remove_autoparts_archives.yml

    - name: install python system package
      shell: bash -c "source ~/.bashrc && source ~/.bash_profile && pip install ${item}"
      with_items:
        - distribute==0.7.3
        - Django==1.6.5
        - Fabric==1.8.3
        - Flask==0.10.1
        - jinja2==2.7.2
        - lxml==3.3.5
        - markupsafe==0.23
        - numpy==1.8.1
        - PyAMF==0.6.1
        - pycrypto==2.6.1
        - setuptools==3.6
        - webapp2==2.5.2
        - webob==1.4
        - PyYAML==3.11
        - mysql-python==1.2.5
        - psycopg2==2.5.3

    - name: install PIL
      shell: bash -c "source ~/.bashrc && source ~/.bash_profile && pip install PIL==1.1.7 --allow-unverified PIL --allow-all-external"
