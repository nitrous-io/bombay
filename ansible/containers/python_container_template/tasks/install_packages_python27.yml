# At the very least this has to support all third-party python libraries that
# AppEngine supports with the same version, so AppEngine user can use
# system-python immediately without installing anything
---
- name: install python system package
  command:  /usr/bin/python /usr/local/bin/pip install ${item}
  with_items:
    - Django==1.3.3
    - Fabric==1.4.3
    - Flask==0.9
    - jinja2==2.6
    - lxml==2.3
    - markupsafe==0.15
    - numpy==1.6.1
    - PIL==1.1.7
    - PyAMF==0.6.1
    - pycrypto==2.6
    - setuptools==0.6c11
    - webapp2==2.5.1
    - webob==1.1.1
    - PyYAML==3.10

- name: Remove .pip from userspace
  command: rm -rf /home/action/.pip
  ignore_errors: True # when .pip does not exist
