# This assumes that pip has been installed before
#
# this will setup
# - virtualenv
# - virtualenvwrapper
# which is enough to actually start coding in python
---
- name: install python dev dependencies
  apt: pkg=$item
  with_items:
    - python-dev
    - libxml2

- name: install setuptools
  apt: pkg=python-setuptools

- name: install pip
  easy_install: name=pip

- name: install virtualenv
  pip: name=$item
  with_items:
    - virtualenv
    - virtualenvwrapper
