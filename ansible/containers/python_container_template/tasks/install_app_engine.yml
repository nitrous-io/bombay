# This download appengine to user workspace
---
- name: download and install appengine to userspace
  shell: cd $HOME
         && rm -Rf $HOME/google_appengine
         && rm -f $HOME/google_appengine_1.7.3.zip
         && wget http://googleappengine.googlecode.com/files/google_appengine_1.7.3.zip
         && unzip $HOME/google_appengine_1.7.3.zip
         && rm $HOME/google_appengine_1.7.3.zip

- name: add .profile with appengine in $PATH
  template: src=../templates/profile.j2 dest=/home/$user/.profile appengine_path=google_appengine
