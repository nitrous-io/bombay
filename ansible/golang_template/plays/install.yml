---
- hosts: localhost
  connection: local
  sudo: True
  gather_facts: False

  tasks:
    - include: ../../shared/tasks/host/setup_iptables_for_bridge_interface.yml
      with_items:
        - 254

- hosts: builder_container
  sudo: False
  gather_facts: False

  vars:
    user: action

  tasks:
    - include: ../../shared/tasks/container/add_default_shell_configs.yml

    - name: download golang src to home
      get_url: url=https://go.googlecode.com/files/go1.1.1.linux-amd64.tar.gz dest=/home/$user/go1.1.1.linux-amd64.tar.gz

    - name: extract go to .go dir
      shell: cd $HOME
              && rm -rf $HOME/.go
              && tar -C $HOME -xzf go1.1.1.linux-amd64.tar.gz
              && mv go .go
              && rm go1.1.1.linux-amd64.tar.gz

    - name: remove downloaded golang distribution
      file: path=/home/$user/go1.1.1.linux-amd64.tar.gz state=absent

    - include: ../../shared/tasks/container/install_app_engine.yml appengine_container=go_appengine_sdk_linux_amd64-1.8.1.zip

    - name: add .bashrc
      copy: src=../files/bashrc dest=/home/$user/.bashrc owner=$user group=$user mode=0644
