---
- hosts: localhost
  connection: local
  sudo: True
  gather_facts: False

  tasks:
    - include: ../../shared/tasks/host/setup_iptables_for_bridge_interface.yml
      with_items:
        - 254

- hosts: builder_container
  sudo: False
  gather_facts: False

  vars:
    user: action

  tasks:
    - include: ../../shared/tasks/container/install_app_engine.yml appengine_container=go_appengine_sdk_linux_amd64-1.7.5.1.zip

    - name: add .profile
      template: src=../templates/profile.j2 dest=/home/$user/.profile
